---
# Runs once, before the first converge. See tools/role-test.sh.
#
# Seeds a dashboard the deployer does not have, which is the only way to reach
# the role's synchronising removal path.
#
# That path is guarded by
#
#   loop: "{{ __dashboards_present_list | difference(__dashboards_copied_list) }}"
#
# and Ansible evaluates a task's `when:` once per loop item. With nothing to
# remove the loop is empty, the conditions are never evaluated, and the task
# reports "skipping" — which is how #493, a `when:` returning a list rather
# than a boolean, survived a green role test on ansible-core 2.21.
#
# This cannot live in converge.yml. Converge runs a second time to prove
# idempotence; it would recreate the file the first run removed, and the
# removal would be reported as a change on every run forever.
- name: Prepare
  hosts: all
  any_errors_fatal: true
  tasks:
    # The role's own default for grafana_ini.paths.data. Written literally
    # because this playbook runs before the role and does not load its
    # defaults; if that default ever moves, this path has to move with it.
    - name: "Create the provisioned dashboards directory ahead of the role"
      ansible.builtin.file:
        path: /srv/grafana-data/dashboards
        state: directory
        mode: "0755"
      become: true

    - name: "Seed a dashboard the deployer does not have"
      ansible.builtin.copy:
        content: |
          {
            "title": "role-test stale",
            "uid": "roletest-stale",
            "panels": [],
            "schemaVersion": 39
          }
        dest: /srv/grafana-data/dashboards/stale.json
        mode: "0644"
      become: true

    # Plugin ownership (#204). Everything here is created as root, before
    # the role installs the package and with it the grafana user. That
    # includes the plugins directory itself, which the role must also repair.
    #
    # roletest-legacy-root is a plugin an older role version installed as
    # root and that is not in grafana_plugins. The role still repairs it,
    # the job the recursive chown from #52 was kept for.
    #
    # roletest-file and roletest-link are top-level entries that are not
    # directories. The role repairs them too, and chowns the link itself,
    # never its target outside the plugins directory.
    #
    # .roletest.staging checks that hidden top-level entries are left alone.
    # The real .<id>.staging directories are grafana-owned and appear while
    # the role runs, so this static root-owned one does not reproduce the
    # race. It only proves the role never selects a hidden entry.
    #
    # Seeded here, not in converge, so the second converge finds the
    # repaired state and idempotence can prove nothing is selected again.
    - name: "Create a root-owned plugin directory the deployer does not list"
      ansible.builtin.file:
        path: /srv/grafana-data/plugins/roletest-legacy-root/dist
        state: directory
        mode: "0755"
      become: true

    - name: "Seed a file inside it"
      ansible.builtin.copy:
        content: "// role-test legacy plugin\n"
        dest: /srv/grafana-data/plugins/roletest-legacy-root/dist/module.js
        mode: "0644"
      become: true

    - name: "Seed a root-owned top-level file"
      ansible.builtin.copy:
        content: "role-test stray file\n"
        dest: /srv/grafana-data/plugins/roletest-file
        mode: "0644"
      become: true

    - name: "Seed a root-owned symlink to a file outside the plugins directory"
      ansible.builtin.file:
        src: /etc/hostname
        dest: /srv/grafana-data/plugins/roletest-link
        state: link
      become: true

    - name: "Seed a root-owned hidden staging directory"
      ansible.builtin.file:
        path: /srv/grafana-data/plugins/.roletest.staging
        state: directory
        mode: "0755"
      become: true

    # A certificate for the variants that serve TLS (#151). Minted here rather
    # than in converge so it is the same file on both converges; `creates:`
    # keeps a rerun from replacing it. The key is world-readable because the
    # grafana user does not exist until the role installs the package, and
    # this is a throwaway key for a throwaway container.
    - name: "Provide a certificate for the TLS variants"
      when: role_test_tls is defined
      become: true
      block:
        - name: "Create the test certificate directory"
          ansible.builtin.file:
            path: /etc/ssl/role-test
            state: directory
            mode: "0755"

        - name: "Mint a self-signed certificate"
          ansible.builtin.command:
            cmd: >-
              openssl req -x509 -newkey rsa:2048 -nodes -days 2
              -subj /CN=grafana.role-test
              -keyout /etc/ssl/role-test/grafana.key
              -out /etc/ssl/role-test/grafana.crt
            creates: /etc/ssl/role-test/grafana.crt

        - name: "Let the grafana service read the test key"
          ansible.builtin.file:
            path: /etc/ssl/role-test/grafana.key
            mode: "0644"
