---
# Assert the end state after the grafana role has been applied.
#
# Ports the assertions from the retired testinfra suite
# (roles/grafana/molecule/default/tests/test_default.py) into Ansible, so the
# checks are in the same language as the role they verify and no pytest or
# testinfra dependency is needed.
#
# Adds assertions the testinfra suite could not make, because it never ran at
# all for this role: that #448's folder loop produced directories rather than a
# stringified list, that #510's grafana-cli invocation actually succeeded, and
# that #538's module_hotfixes reached the repository file on the RHEL family.
- name: Verify
  hosts: all
  any_errors_fatal: true
  become: true
  tasks:
    - name: "Gather service and package facts"
      block:
        - name: "Collect service facts"
          ansible.builtin.service_facts:

        - name: "Collect package facts"
          ansible.builtin.package_facts:
            manager: auto

    # ------------------------------------------------ directories and files
    - name: "Stat the directories the role must create"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __dirs
      loop:
        - /etc/grafana
        - /var/log/grafana
        - /var/lib/grafana
        - /var/lib/grafana/dashboards
        - /srv/grafana-plugins

    - name: "Assert each is a directory"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "expected directory missing: {{ item.item }}"
      loop: "{{ __dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "Stat the configuration file"
      ansible.builtin.stat:
        path: /etc/grafana/grafana.ini
      register: __ini

    - name: "Assert grafana.ini exists and is a file"
      ansible.builtin.assert:
        that:
          - __ini.stat.exists
          - __ini.stat.isreg
        fail_msg: "/etc/grafana/grafana.ini is missing or not a regular file"

    # ---------------------------------------------------- package and service
    - name: "Assert the grafana package is installed"
      ansible.builtin.assert:
        that:
          - "'grafana' in ansible_facts.packages"
        fail_msg: "the grafana package is not installed"

    - name: "Assert grafana-server is running"
      ansible.builtin.assert:
        that:
          - "'grafana-server.service' in ansible_facts.services"
          - "ansible_facts.services['grafana-server.service'].state == 'running'"
        fail_msg: >-
          grafana-server is not running:
          {{ ansible_facts.services['grafana-server.service'].state | default('absent') }}

    - name: "Assert the HTTP port is listening"
      ansible.builtin.wait_for:
        port: 3000
        host: 127.0.0.1
        timeout: 60

    # ------------------------------------- #448 dashboard folders were created
    - name: "Stat the dashboard folders the role should have created"
      ansible.builtin.stat:
        path: "/var/lib/grafana/dashboards/{{ item }}"
      register: __folders
      loop:
        - team-a
        - nested/team-b

    - name: "Assert the folder loop produced directories, not a stringified list"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: >-
          dashboard folder '{{ item.item }}' was not created; the loop in
          dashboards.yml may have received a string or a list of characters
          rather than a list of folder names
      loop: "{{ __folders.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ------------------- #244 the copy and its handler agree about ownership
    # Idempotence already fails when they disagree, but only as "2 changed
    # tasks", which says nothing about why. This names the cause, so a
    # regression reports the defect instead of a symptom.
    - name: "Stat the dashboard the grafana.net route provisioned"
      ansible.builtin.stat:
        path: /var/lib/grafana/dashboards/1860.json
      register: __netdash

    - name: "Assert it is owned by grafana, not root"
      ansible.builtin.assert:
        that:
          - __netdash.stat.exists
          - __netdash.stat.pw_name == 'grafana'
          - __netdash.stat.gr_name == 'grafana'
        fail_msg: >-
          /var/lib/grafana/dashboards/1860.json is owned by
          {{ __netdash.stat.pw_name | default('nothing, it is missing') }};
          the copy task and the "provisioned dashboards changed" handler
          disagree about ownership and will reverse each other every run

    - name: "Read the dashboard the grafana.net route provisioned"
      ansible.builtin.slurp:
        src: /var/lib/grafana/dashboards/1860.json
      register: __netdash_content

    # The positive half matches the rewritten key and value together. A bare
    # 'role-test' would pass on the fixture's own title, and 'DS_PROMETHEUS'
    # being absent would pass on a regex that deleted rather than replaced.
    - name: "Assert no DS_ placeholder survived"
      ansible.builtin.assert:
        that:
          - "'\"datasource\": \"role-test\"' in (__netdash_content.content | b64decode)"
          - "'DS_PROMETHEUS' not in (__netdash_content.content | b64decode)"
        fail_msg: >-
          the exported dashboard's '${DS_...}' placeholder was not replaced
          with the configured datasource name

    # ------------------------- #493 the synchronising removal path ran at all
    # prepare.yml seeded stale.json, which the deployer does not have. Its
    # absence here is the only evidence that the removal task evaluated its
    # conditions rather than skipping past them on an empty loop.
    - name: "Stat the dashboard prepare seeded and the role should have removed"
      ansible.builtin.stat:
        path: /var/lib/grafana/dashboards/stale.json
      register: __stale

    - name: "Assert the synchronise path removed it"
      ansible.builtin.assert:
        that:
          - not __stale.stat.exists
        fail_msg: >-
          /var/lib/grafana/dashboards/stale.json still exists; the synchronise
          task did not remove it, so either grafana_provisioning_synced is not
          set or its looped conditions were never evaluated

    # --------------------------------------- #510 the plugin CLI ran at all
    - name: "Stat the plugin directory the plugin CLI should have created"
      ansible.builtin.stat:
        path: /srv/grafana-plugins/grafana-clock-panel
      register: __plugin

    - name: "Assert the plugin was installed"
      ansible.builtin.assert:
        that:
          - __plugin.stat.exists
          - __plugin.stat.isdir
        fail_msg: >-
          grafana-clock-panel was not installed. On Grafana 13 the plugin CLI
          fails unless it runs from its homepath, which is what the chdir in
          plugins.yml provides:
          "Grafana-server Init Failed: Could not find config defaults"

    # -------------------- #508 the plugin is owned by the service account
    # Installed as root, the directory is still there and the assertion above
    # still passes, but Grafana cannot replace it when the plugin is updated
    # from the UI. Ownership is the only thing that distinguishes the two.
    - name: "Assert the plugin is owned by grafana, not root"
      ansible.builtin.assert:
        that:
          - __plugin.stat.pw_name == 'grafana'
          - __plugin.stat.gr_name == 'grafana'
        fail_msg: >-
          /srv/grafana-plugins/grafana-clock-panel is owned by
          {{ __plugin.stat.pw_name }}:{{ __plugin.stat.gr_name }}, not
          grafana:grafana; the Grafana server cannot update this plugin from
          the UI because it cannot replace files it does not own

    # ------------------- #331 server and CLI resolve one plugin directory
    # The role used to compute --pluginsDir from paths.data while leaving
    # paths.plugins out of grafana.ini entirely, so the server fell back to its
    # own default and the two disagreed. Both now come from one variable.
    #
    # The CLI cannot be made to read paths.plugins from the configuration file;
    # handed --config and nothing else it installs into its own built-in
    # default. So the flag stays, and this asserts the flag carried the
    # configured value rather than the default it would otherwise have used.
    - name: "Stat the plugin directory the CLI defaults to when misconfigured"
      ansible.builtin.stat:
        path: /var/lib/grafana/plugins/grafana-clock-panel
      register: __plugin_default_dir

    - name: "Assert the plugin did not land in the CLI's built-in default"
      ansible.builtin.assert:
        that:
          - not __plugin_default_dir.stat.exists
        fail_msg: >-
          grafana-clock-panel was installed into /var/lib/grafana/plugins while
          grafana.ini sets paths.plugins to /srv/grafana-plugins; the plugin CLI
          was not told the configured directory, so the Grafana server will not
          load what the role installed

    - name: "Read the rendered configuration file"
      ansible.builtin.slurp:
        src: /etc/grafana/grafana.ini
      register: __ini_content

    - name: "Assert grafana.ini names the plugin directory"
      ansible.builtin.assert:
        that:
          - "'plugins = /srv/grafana-plugins' in (__ini_content.content | b64decode)"
        fail_msg: >-
          grafana.ini does not set paths.plugins, so the Grafana server falls
          back to its own default while the plugin CLI resolves the directory
          separately; the two disagree whenever paths.data is overridden

    # --------------------------------- RHEL-family only: #538 module_hotfixes
    - name: "RHEL family assertions"
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: "Stat the yum repository file"
          ansible.builtin.stat:
            path: /etc/yum.repos.d/grafana.repo
          register: __repo

        - name: "Assert the repository file exists"
          ansible.builtin.assert:
            that:
              - __repo.stat.exists
              - __repo.stat.isreg
            fail_msg: "/etc/yum.repos.d/grafana.repo is missing"

        - name: "Read the repository file"
          ansible.builtin.slurp:
            src: /etc/yum.repos.d/grafana.repo
          register: __repo_content

        - name: "Assert module_hotfixes is set, so grafana wins over system modules"
          ansible.builtin.assert:
            that:
              - "'module_hotfixes' in (__repo_content.content | b64decode)"
            fail_msg: >-
              module_hotfixes is absent from grafana.repo; dnf may prefer a
              system module over the grafana repository

    # ------------------------------- Debian family: the repo path is not taken
    - name: "Assert no yum repository was written on the Debian family"
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: "Stat the yum repository file"
          ansible.builtin.stat:
            path: /etc/yum.repos.d/grafana.repo
          register: __norepo

        - name: "Assert it is absent"
          ansible.builtin.assert:
            that:
              - not __norepo.stat.exists
            fail_msg: "a yum repository file was written on a Debian-family host"
