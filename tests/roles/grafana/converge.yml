---
# Apply the grafana role. Run twice by tools/role-test.sh: once to converge,
# once to prove idempotence.
#
# This role carries four of the fork's seven curated contributions, and had no
# runtime coverage at all before this harness:
#
#   #510  chdir so grafana-cli finds its homepath on Grafana 13
#   #448  dashboard folder loop receives a list, not a stringified list
#   #534  grafana_rhsm_* conditions survive undefined variables   (yum/dnf only)
#   #538  module_hotfixes on the yum repository                   (yum/dnf only)
#
# A dashboards subdirectory is configured deliberately: without one, #448's
# folder loop never executes and the fix ships unexercised.
#
# The same reasoning extends to the two dashboard routes this scenario used to
# leave at their defaults, each of which hid a defect behind a green test:
#
#   #493  a `when:` returning a list, fatal on ansible-core 2.19 and later.
#         Gated by grafana_provisioning_synced, which defaults to false.
#   #244  a copy declaring owner: root against a handler that recurses the
#         same tree setting owner: grafana, so the two undo each other every
#         run. Gated by grafana_dashboards, which defaults to [].
#
# Both are set below. A route left at its default is a route this repository
# ships without ever running.
- name: Converge
  hosts: all
  any_errors_fatal: true
  vars:
    grafana_ini:
      security:
        admin_user: admin
        admin_password: password
      # Exercises #331. A non-default data path is the only configuration that
      # can tell the fix from the bug: at the default, the directory the role
      # passes to the CLI and the CLI's own built-in default are the same
      # string, so a role that computes the wrong value still passes. Moved
      # here, the server populates paths.plugins with its bundled plugins and
      # the CLI must be told to install into it too, or the two disagree and
      # `creates:` never matches -- which is exactly how the bug presents.
      #
      # paths.data rather than paths.plugins, deliberately. Overriding plugins
      # directly would skip the `when: grafana_ini.paths.plugins is not
      # defined` derivation in tasks/main.yml, which is the path every default
      # deployment takes. Overriding data exercises the derivation AND lands
      # the plugins somewhere that is not the CLI's default.
      paths:
        data: /srv/grafana-data
      # Exercises #417: a boolean two levels deep, which is the only render
      # path in grafana.ini.j2 the rest of this scenario never reaches -- the
      # role's default `auth: {}` has no subsections, so nothing else produces
      # a [section.subsection] header.
      #
      # basic rather than the reported ldap, deliberately. Setting
      # auth.ldap.enabled would enable LDAP against an ldap.toml this scenario
      # does not provide, and the reported symptom is a missing button in a
      # browser, which the harness cannot see. Basic auth is on by default, so
      # this changes nothing about the running server and still renders the
      # line whose case is the defect.
      auth:
        basic:
          enabled: true
    # Exercises #448: the loop that turns dashboard subdirectory paths into
    # folder names. With no subdirectories the block is skipped entirely.
    grafana_dashboards_dir: "{{ role_test_fixtures }}/dashboards"
    # Exercises #493: the synchronising removal tasks, and the non-boolean
    # conditional guarding them, run only when this is true.
    grafana_provisioning_synced: true
    # Exercises #244: the grafana.net route, whose copy task is the one whose
    # ownership the handler reverses. dashboard_url rather than dashboard_id
    # keeps the control node off the network -- get_url takes a file:// URL,
    # and everything after the download is the same code either way.
    #
    # datasource is not optional: "Set the correct data source name in the
    # dashboard" dereferences item.item.datasource with no when: guard, so an
    # entry without it fails on an undefined variable. It names the datasource
    # configured below.
    grafana_dashboards:
      - dashboard_url: "file://{{ role_test_fixtures }}/grafana-net/1860.json"
        datasource: role-test
    # Exercises #510: installing a plugin is the only thing that runs
    # grafana-cli, and grafana-cli is what fails on Grafana 13 without chdir.
    # An empty list skips the task and the fix ships unexercised.
    grafana_plugins:
      - grafana-clock-panel
    # The role fails fast if dashboards are provisioned without a datasource.
    grafana_datasources:
      - name: role-test
        type: prometheus
        access: proxy
        url: http://127.0.0.1:9090
        isDefault: true
  pre_tasks:
    # grafana_dashboards_dir is a CONTROL-NODE path: the role's discovery tasks
    # are delegate_to: localhost and copy what they find onto the target. The
    # subdirectories therefore have to exist here, not in the container.
    #
    # Created rather than committed because git cannot track empty directories,
    # and each needs a dashboard file for the copy step to have work to do.
    - name: "Create dashboard fixtures on the control node"
      ansible.builtin.file:
        path: "{{ grafana_dashboards_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - team-a
        - nested/team-b
      delegate_to: localhost
      become: false
      run_once: true

    - name: "Place a dashboard in each fixture folder"
      ansible.builtin.copy:
        content: |
          {
            "title": "role-test {{ item }}",
            "uid": "roletest-{{ item | replace('/', '-') }}",
            "panels": [],
            "schemaVersion": 39
          }
        dest: "{{ grafana_dashboards_dir }}/{{ item }}/dashboard.json"
        mode: "0644"
      loop:
        - team-a
        - nested/team-b
      delegate_to: localhost
      become: false
      run_once: true

    # The grafana.net route's fixture, served to get_url as a file:// URL so
    # the route executes without the control node reaching grafana.com.
    #
    # The datasource placeholder is deliberate. An exported dashboard carries
    # '${DS_<NAME>}' where the exporter's datasource was, and the role rewrites
    # it to the configured name. With no placeholder the rewrite task would run
    # against nothing and its regex would ship unexercised, which is the same
    # defect as leaving a route at its default.
    - name: "Create the grafana.net fixture directory on the control node"
      ansible.builtin.file:
        path: "{{ role_test_fixtures }}/grafana-net"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: "Create the grafana.net fixture on the control node"
      ansible.builtin.copy:
        content: |
          {
            "title": "role-test grafana-net",
            "uid": "roletest-grafana-net",
            "panels": [
              {"datasource": "${DS_PROMETHEUS}", "type": "timeseries"}
            ],
            "schemaVersion": 39
          }
        dest: "{{ role_test_fixtures }}/grafana-net/1860.json"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

  roles:
    - grafana
