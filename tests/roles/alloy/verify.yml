---
- name: Verify
  hosts: all
  any_errors_fatal: true
  become: true
  tasks:
    - name: "Collect service facts"
      ansible.builtin.service_facts:

    - name: "Stat the configuration file"
      ansible.builtin.stat:
        path: /etc/alloy/config.alloy
      register: __config

    - name: "Assert the configuration file exists"
      ansible.builtin.assert:
        that:
          - __config.stat.exists
          - __config.stat.isreg
        fail_msg: "/etc/alloy/config.alloy is missing"

    - name: "Assert alloy is running"
      ansible.builtin.assert:
        that:
          - "'alloy.service' in ansible_facts.services"
          - "ansible_facts.services['alloy.service'].state == 'running'"
        fail_msg: >-
          alloy is not running:
          {{ ansible_facts.services['alloy.service'].state | default('absent') }}

    - name: "Assert the alloy UI port is listening"
      ansible.builtin.wait_for:
        port: 12345
        host: 127.0.0.1
        timeout: 60
