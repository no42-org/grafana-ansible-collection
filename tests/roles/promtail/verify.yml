---
- name: Verify
  hosts: all
  any_errors_fatal: true
  become: true
  tasks:
    - name: "Collect service facts"
      ansible.builtin.service_facts:

    - name: "Stat the configuration file"
      ansible.builtin.stat:
        path: /etc/promtail/config.yml
      register: __config

    - name: "Assert the configuration file exists"
      ansible.builtin.assert:
        that:
          - __config.stat.exists
          - __config.stat.isreg
        fail_msg: "/etc/promtail/config.yml is missing"

    - name: "Assert promtail is running"
      ansible.builtin.assert:
        that:
          - "'promtail.service' in ansible_facts.services"
          - "ansible_facts.services['promtail.service'].state == 'running'"
        fail_msg: >-
          promtail is not running:
          {{ ansible_facts.services['promtail.service'].state | default('absent') }}

    - name: "Assert the HTTP port is listening"
      ansible.builtin.wait_for:
        port: 9080
        host: 127.0.0.1
        timeout: 60

    # The pin is the fix, so assert the installed version rather than only that
    # something installed. A regression to `latest` would 404 at converge, but
    # a regression to some other pinned version would not.
    - name: "Obtain the installed promtail version"
      ansible.builtin.command:
        cmd: "/usr/bin/promtail --version"
      register: __version
      changed_when: false
      failed_when: false

    - name: "Assert the last released promtail is what got installed"
      ansible.builtin.assert:
        that:
          - "'3.6.0' in (__version.stdout | default('')) + (__version.stderr | default(''))"
        fail_msg: >-
          expected promtail 3.6.0, the last release with published packages;
          got {{ (__version.stdout | default('')) + (__version.stderr | default('')) | trim }}
