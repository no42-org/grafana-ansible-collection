  6.2.0:
    changes:
      release_summary: First curated release of this fork. Version numbers are this fork's own and do not correspond to any grafana.grafana release; the upstream commit each release is built from is recorded in its GitHub release notes. This release carries seven upstream pull requests that are open and unmerged, with their authors preserved. Each is dropped once upstream merges it.
