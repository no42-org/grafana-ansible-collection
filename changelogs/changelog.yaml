  6.2.1:
    changes:
      release_summary: 'Patch release. The user-facing change is a set of role and module bugfixes, one of them carried from an upstream pull request. Everything else in this release is repository infrastructure that the published collection does not contain: the lint gates now actually fail when a linter finds something, the quality gates have a single shared definition used by both CI and the release, and the development toolchain installs without a specific Python interpreter. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      bugfixes:
        - Skip the firewalld rule removal during alloy uninstall when firewalld is inactive, so the play no longer relied on ignore_errors and now mirrors the deploy conditions by @baltvinicius in https://github.com/grafana/grafana-ansible-collection/pull/539
        - Return a value from alert_contact_point when the read-back after a successful update does not list the UID. The function fell through and returned None, which the module unpacks into three values, so a successful update could raise a TypeError instead of reporting success.
        - Set pipefail on the grafana_agent version-detection pipelines. Without it a failing curl or a missing grafana-agent binary produced an empty string and the pipeline still reported success, so the role proceeded with no version at all.
        - Set an explicit mode on the systemd drop-in the grafana role creates with blockinfile, which previously took whatever the umask gave it.
        - Use ansible.builtin.command instead of shell for two grafana_agent tasks that need no shell, removing a layer of word-splitting and quoting from paths built by template.
        - Remove a duplicated assignment to api_url in the dashboard module.
      minor_changes:
        - Use fully-qualified collection names for builtin actions in the opentelemetry_collector role and the integration targets, and correct task naming and Jinja spacing, so the collection satisfies ansible-lint's production profile with no failures or warnings.
        - Whitespace and indentation corrections across roles/ and examples/ so the collection is clean under yamllint and editorconfig-checker. No behaviour changes.
    release_date: '2026-09-10'
  6.2.2:
    changes:
      release_summary: 'Corrects what the published collection says about its own dependencies. requirements.txt declared this repository''s linters -- yamllint, ansible-lint and pylint -- and now declares requests, the library every module actually imports and which was declared nowhere. Two further manifests stop shipping: requirements.yml, which duplicated galaxy.yml''s own dependencies as unconstrained git URLs, and roles/grafana/test-requirements.txt, which listed Molecule''s dependencies for scenarios this fork never invokes. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      bugfixes:
        - requirements.txt now declares requests, the collection's actual Python runtime dependency. It previously declared yamllint, ansible-lint and pylint, none of which a consumer needs, while the library all 18 modules import behind a HAS_REQUESTS guard was declared nowhere -- so a module reporting missing_required_lib('requests') pointed at documentation that did not exist.
      minor_changes:
        - requirements.yml is no longer published. It duplicated galaxy.yml's own dependencies as git URLs pointing at main, so a consumer following it would have installed three collections unconstrained. ansible-galaxy resolves the constrained versions from the collection's MANIFEST.json instead, and continues to do so.
        - roles/grafana/test-requirements.txt is no longer published. It declared molecule, docker, pytest-testinfra, jmespath, selinux and passlib for Molecule scenarios this fork never invokes.
    release_date: '2026-09-10'
  7.0.0:
    changes:
      release_summary: 'Two roles are removed. grafana_agent and promtail no longer ship: Grafana archived the Agent, and declared Promtail end of life on 2026-03-02 with no packages published after Loki 3.6.0. Any playbook calling indigo423.grafana.grafana_agent or indigo423.grafana.promtail no longer resolves them; the alloy role replaces both. Every remaining role now installs a pinned version by default rather than whichever release was newest at run time, and a weekly tracker opens a pull request, verified by the role tests, when a pin falls behind. The grafana role retries repository metadata fetches on RHEL to ride out a cache offset in Grafana''s package CDN. The roles are now executed on ansible-core 2.18 on both package families and, for grafana and alloy, on 2.21.4, the newest release inside the range requires_ansible claims. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      breaking_changes:
        - The grafana_agent role is removed. Grafana archived the Agent in favour of Alloy, and the role shipped no test, so no version bump could ever be verified. Use the alloy role.
        - The promtail role is removed. Grafana declared Promtail end of life on 2026-03-02 and published no packages after Loki 3.6.0, so nothing newer will ever exist. Use the alloy role.
        - Every role installs a pinned version by default instead of resolving the newest release at run time. The defaults are grafana 13.2.1, loki 3.7.7, mimir 3.2.1, tempo 3.0.3, alloy 1.19.2 and opentelemetry_collector 0.160.0. Set <role>_version to a version of your choice, or to latest to restore the previous behaviour. Every pin except opentelemetry_collector is what latest resolved to on the day it was set.
        - The opentelemetry_collector role's default version moves from 0.90.1 to 0.160.0. The old default predated pinning and had fallen seventy minor releases behind.
      minor_changes:
        - The grafana role retries its two package installs on RHEL. grafana_install_retries (default 5) and grafana_install_retry_delay (default 30 seconds) apply to both the dependency install and the Grafana install, because update_cache refreshes every enabled repository on the first as well. Set grafana_install_retries to 0 to install exactly once.
        - A weekly workflow compares every role's pinned version with its upstream releases and opens one pull request per role that has fallen behind. The pull request runs that role's tests on both package families before a human merges it. grafana is excluded because its version is a package-repository version rather than a release tag.
        - Roles are executed on ansible-core 2.18 on both package families, and grafana on both families plus alloy on Debian are also executed on 2.21.4, the newest release inside the requires_ansible range. Static analysis covers 2.17, 2.18 and devel. requires_ansible is unchanged at >=2.17.0,<3.0.0.
      bugfixes:
        - grafana on RHEL no longer fails intermittently with "Bad GPG signature" on repomd.xml. The cause is the cache in front of rpm.grafana.com serving the metadata and its signature from different generations for up to two minutes after a republish, not the key or the pinned version, and the install now retries across that window. The repository GPG check stays enabled, as Grafana's own documentation configures it.
        - ansible.cfg used collections_paths, a spelling ansible-core 2.19 removed and 2.21 silently ignores. The singular collections_path is read by every version in the requires_ansible range.
    release_date: '2026-09-11'
  7.1.0:
    changes:
      release_summary: 'The mimir role can now render any top-level key of /etc/mimir/config.yml, not only the twelve its template names. mimir_config_extra takes a dict of top-level keys -- multitenancy_enabled, store_gateway, compactor, frontend and the rest of Mimir''s sections -- and renders it after the named sections; a key that also has a named section is refused before the template runs. The /ready wait is configurable through mimir_ready_retries and mimir_ready_delay, defaulting to the 5 and 8 that were literal. No existing behaviour changes. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      minor_changes:
        - 'The mimir role gains mimir_config_extra, a dict of top-level keys for /etc/mimir/config.yml that have no mimir_<section> variable of their own. It is rendered after the named sections. A key present both there and as a named section fails the run naming the key and the variable to use instead, because YAML parsers accept a duplicated top-level key and Mimir would read whichever survived parsing.'
        - 'The mimir role''s wait for /ready is configurable through mimir_ready_retries (default 5) and mimir_ready_delay (default 8 seconds), the values that were previously literal. A clustered node that joins memberlist before its ingester reports ready can need more than the 40 seconds those allow.'
        - 'The mimir role test sets multitenancy_enabled: false through the passthrough and checks it from outside: a labels query with no X-Scope-OrgID header is answered rather than refused.'
    release_date: '2026-09-11'
  7.2.0:
    changes:
      release_summary: 'Two literals in the mimir role become variables, both defaulting to what the role always did. mimir_target is the target line of the configuration; a consumer that never calls the alertmanager can run all alone, which also leaves the memberlist KV service uninitialised on a single node. mimir_config_mode is the mode of /etc/mimir/config.yml; a consumer that renders object-store credentials into it can set 0640. No existing behaviour changes. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      minor_changes:
        - 'The mimir role gains mimir_target, the target line of /etc/mimir/config.yml, defaulting to the all,alertmanager,overrides-exporter the template always wrote. target joins the keys mimir_config_extra refuses.'
        - 'The mimir role gains mimir_config_mode, the mode of /etc/mimir/config.yml, defaulting to the 0644 the task always wrote. The file carries secret_access_key when an S3 backend is configured; 0640 keeps it to the mimir user and group.'
        - 'The mimir role test sets mimir_config_mode to 0640 and asserts the mode of the rendered file.'
    release_date: '2026-09-11'
  7.2.1:
    changes:
      release_summary: 'A correctness release for the grafana role''s dashboard provisioning. Two defects, each in a provisioning route the role tests never entered. The synchronising removal guarded itself with a conditional that returns a list rather than a boolean, which ansible-core 2.19 made fatal, so that path aborted the play on every version from 2.19 up while requires_ansible claims support to 3.0.0. And the grafana.net dashboard copy declared owner root against a handler that recurses the same tree setting owner grafana, so the two reversed each other and the role never converged. No variable, default or interface changes; a consumer upgrading gets the fixes without action. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      bugfixes:
        - 'The grafana role''s "Remove dashboards not present on deployer machine (synchronize)" task no longer aborts the play on ansible-core 2.19 and later. Its conditions used `X is defined and X`, and Jinja''s `and` yields an operand rather than a boolean, so the condition evaluated to a list; ansible-core 2.19 rejects a non-boolean conditional outright. They are length comparisons now. Addresses grafana/grafana-ansible-collection#493.'
        - 'The grafana role''s "Import grafana.net dashboards" task copies with owner grafana rather than owner root. The handler it notifies recurses the provisioned dashboards tree setting owner grafana, so the copy and the handler reversed each other on every run and the role could never report no change. Addresses grafana/grafana-ansible-collection#244.'
        - 'The grafana role''s folder synchronise task gains the same two corrections: its condition is a list of boolean tests rather than a Jinja `and`, and grafana_provisioning_synced is filtered through `| bool`. Without the filter a string extra-var such as `-e grafana_provisioning_synced=false` read as truthy there while the dashboards task, which does filter, read it as false, so synchronisation was nominally off while folders were removed.'
      minor_changes:
        - 'The role test harness gains an optional prepare phase, run once before the first converge, for state a role is expected to reconcile away. Converge runs twice to prove idempotence, so it cannot create state a role is meant to remove without that removal reporting a change forever. A role without a prepare.yml does not get the phase.'
        - 'The grafana role test enters the dashboard provisioning routes it previously left at their defaults: grafana_provisioning_synced and a grafana_dashboards entry are set, and verify asserts the ownership of provisioned files, that the datasource placeholder was rewritten, and that a dashboard absent from the deployer is removed.'
    release_date: '2026-09-19'
  7.3.0:
    changes:
      release_summary: 'Four defects in the grafana role and one shared across five roles, all of them cases where the collection had drifted behind what it installs. Plugin installation was broken outright on Grafana 13, which removed the grafana-cli binary the role invoked; booleans in grafana_ini reached grafana.ini capitalised, which Grafana''s own documentation says they must not be; a fresh install could restart Grafana while its database migrations were still running, leaving a database no later start recovers; and every role that resolves <role>_version: latest could adopt a release tag that was never a version, because the expression that was meant to filter them could only substitute. No variable or interface is removed, and one is added. An existing deployment rewrites grafana.ini on its first converge and restarts Grafana once -- see the upgrade note below. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      bugfixes:
        - 'The grafana role installs plugins again on Grafana 13, which removed the grafana-cli binary the role invoked. The plugin CLI form is now selected at run time by probing for the grafana cli subcommand, so the role works from Grafana 5.1 through 13.x and emits no deprecation warning on current versions. Addresses grafana/grafana-ansible-collection#509.'
        - 'The grafana role installs plugins as the grafana user rather than root. Extracted as root, a plugin directory is one the Grafana server cannot replace, so updating that plugin from the user interface fails. Addresses grafana/grafana-ansible-collection#508.'
        - 'The grafana role resolves one plugin directory for both the server and the plugin CLI. The role computed the CLI''s --pluginsDir from paths.data while leaving paths.plugins out of grafana.ini entirely, so the server fell back to its own default and the two disagreed whenever paths.data was overridden. Addresses grafana/grafana-ansible-collection#331.'
        - 'The grafana role renders booleans in grafana.ini as true and false rather than Python''s True and False. Ansible resolves a YAML true to a Python bool and Jinja stringifies it capitalised; Grafana documents the lowercase form, and for auth.ldap.enabled the difference is silent -- the server enables LDAP but the login page never offers it. Values the user wrote as strings are untouched, so quoting remains a valid escape hatch. Addresses grafana/grafana-ansible-collection#417.'
        - 'The grafana role waits for Grafana to report its database ready before flushing handlers. On a first install the service start begins the database migrations and the queued restart handler could terminate Grafana part way through them, leaving a database that no later start recovers and that has to be wiped by hand. Carries grafana/grafana-ansible-collection#528 by Dmitriy Rabotyagov, with the corrections needed to make it run.'
        - 'The alloy, loki, mimir, tempo and opentelemetry_collector roles resolve <role>_version: latest to a release whose tag is actually a version. regex_replace is a substitution, not a filter: a tag that did not match was returned unchanged and became the version, so a Go submodule tag such as syntax/v0.1.1 produced a download URL that 404s. Each role now reads the releases list, rejects drafts and prereleases on the flags GitHub sets, takes the newest release whose tag matches its pattern, and fails naming the tags it saw when none qualifies. Addresses grafana/grafana-ansible-collection#530.'
      minor_changes:
        - 'The grafana role gains grafana_ini.paths.plugins, derived from paths.data when unset and rendered into grafana.ini. Both the Grafana server and the plugin CLI read this one value, so they cannot disagree about where plugins live.'
        - 'The alloy and opentelemetry_collector roles default their GitHub API endpoint to the releases list rather than releases/latest, because the newest release in those repositories is not reliably a version of the software. alloy_github_api_url and otel_collector_latest_url keep their names, and a releases/latest URL set by a consumer still resolves.'
        - 'The loki role pin moves to 3.7.8 and the opentelemetry_collector role pin to 0.161.0, each verified by that role''s tests on both package families before merging.'
        - 'The grafana role test asserts the rendered grafana.ini contains no capitalised boolean, that the database is ready after a converge, and that a plugin installs into the configured directory owned by grafana. The version selection gains a suite of its own, run by make version-select-test against recorded GitHub payloads, because no role test can reach the latest path while every role pins its version.'
      known_issues:
        - 'An existing deployment rewrites /etc/grafana/grafana.ini on its first converge after upgrading and restarts Grafana once. Five booleans in the role''s own defaults change case, and paths.plugins is newly rendered. No setting changes value.'
    release_date: '2026-09-21'
  7.4.0:
    changes:
      release_summary: 'Two test harnesses this collection never had, and the defects that existed because it never had them. A plugin module''s whole behaviour is which HTTP route it builds, so make module-test now runs one against a running Grafana on the version the grafana role pins. The alloy role validates its configuration with alloy validate before writing it and confirms the service is still running after the restart, and its role test applies a configuration Alloy rejects. Both were built around a defect each had let through: the datasource module could not update a data source on any Grafana 13, which removed the route its update path built, and the alloy role reported success for a configuration Alloy cannot run, because a readiness check that cannot fail on the first attempt cannot tell a healthy service from one systemd is respawning ten times a second. The grafana role pin moves to 13.2.2. Version numbers are this fork''s own and do not correspond to any grafana.grafana release; the upstream commit this release is built from is recorded in its GitHub release notes.'
      bugfixes:
        - 'The datasource module updates an existing data source through PUT /api/datasources/uid/<uid> rather than PUT /api/datasources/<id>, which Grafana 13.0 removed. Measured against the real API, one container per version: the numeric-id route answers on 10.4.19, 11.6.7 and 12.3.0 and returns 404 on 13.0.1, 13.1.0 and 13.2.1, while the uid route answers on all six. The uid is resolved from the data source list by the name that collided, so uid stays optional for consumers who never set one, and a 409 with no matching data source now fails with a message quoting Grafana rather than raising KeyError. Addresses grafana/grafana-ansible-collection#537.'
        - 'The alloy role validates the configuration with alloy validate before writing it and before restarting the service, so a configuration Alloy rejects fails the play and never replaces the file on disk. The readiness check could not do this: Ansible applies retries only after a failed attempt, so a first-try 200 from /-/ready ends the task. Addresses grafana/grafana-ansible-collection#535.'
        - 'The alloy role confirms the service is still running after it restarts it, by comparing the systemd unit''s NRestarts across a settle window. The packaged unit is Restart=always with the default RestartSec of 100ms, so a configuration that loads and then crashes is respawned about ten times a second and still answers /-/ready from ActiveState=active. Only NRestarts separates the two.'
        - 'Release notes list the upstream contributions a release newly carried rather than every one carried since the fork diverged, which repeated the same list under every version number. The cumulative count is stated in one line instead.'
        - 'tools/check-shipped-manifests.py imports ElementTree in the form ansible-test sanity''s pylint requires. Missed locally because the sanity tree was staged with the distribution exclude list, which drops /tools; CI checks out the whole repository, so it lints files that staging had removed.'
      minor_changes:
        - 'The alloy role gains alloy_validate_config (default true), alloy_validate_extra_args and alloy_restart_settle_seconds (default 10). Validation carries over --stability.level and --feature.community-components.enabled from alloy_env_file_vars.CUSTOM_ARGS, because alloy validate defaults to generally-available with community components off and would otherwise reject a configuration that runs. It is skipped, never failed, when alloy_version predates 1.9.0, the release that introduced the subcommand, or the binary is not yet on the host.'
        - 'The grafana role pin moves to 13.2.2, verified by that role''s tests on both package families before merging.'
        - 'A module test harness runs a plugin module against a running Grafana, on the version the grafana role pins: make module-test MODULE=datasource. A module''s whole behaviour is which HTTP route it builds, so only a running Grafana can judge it, and nothing in this repository had ever done so. MODULE_TEST_GRAFANA_VERSION runs the same scenario against another version, which is how a route removal gets dated.'
        - 'make ci-lint-versions compares the versions the documentation claims with the versions the roles pin, and fails in both directions. A pin is written down three times -- defaults/main.yml, the root README badge and the role README -- and only the first moved on a bump, so six claims across three roles had gone stale, including a role README that still documented loki_version: latest. tools/bump-role-versions.sh now rewrites the documentation as part of the bump.'
        - 'make sanity runs ansible-test sanity staged the way CI stages the tree, and the test workflows filter on everything their harnesses read rather than on roles/ alone.'
        - 'Every role''s version pin is compared against the source that role installs from, rather than against a GitHub release for all of them. grafana installs from apt.grafana.com and rpm.grafana.com, so it was excluded and became the one pin nothing watched: 13.2.2 was released on 2026-09-15 and this collection stayed on 13.2.1 with nothing to say so. A package repository has an index, and the index is the list of versions that are installable. A release whose .rpm, .deb or .tar.gz has not finished uploading is held rather than proposed, because proposing it opens a pull request whose role test cannot pass.'
      known_issues:
        - 'A playbook whose alloy configuration Alloy cannot load now fails where it previously reported success. That is the defect being fixed, but it is a run that changes colour without the playbook changing. alloy_validate_config: false and alloy_restart_settle_seconds: 0 restore the previous behaviour.'
    release_date: '2026-09-22'
