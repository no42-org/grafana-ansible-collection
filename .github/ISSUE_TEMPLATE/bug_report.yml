---
name: Bug report
description: Something in a role, module or the collection itself does not work
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        **Security problems do not belong here** — use
        [private vulnerability reporting](https://github.com/no42-org/grafana-ansible-collection/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/no42-org/grafana-ansible-collection/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Collection version
      description: The version of `indigo423.grafana` you installed.
      placeholder: "6.2.0"
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Which role or module?
      options:
        - "role: grafana"
        - "role: loki"
        - "role: mimir"
        - "role: tempo"
        - "role: alloy"
        - "role: opentelemetry_collector"
        - "module (alert_contact_point, dashboard, datasource, …)"
        - "the collection itself (install, namespace, packaging)"
        - "the release pipeline or tooling"
    validations:
      required: true

  - type: dropdown
    id: family
    attributes:
      label: Distribution family
      description: >-
        This matters more than the specific distribution. Several code paths are
        reachable on only one package manager.
      options:
        - "Debian family (Debian, Ubuntu)"
        - "RHEL family (RHEL, Rocky, AlmaLinux, Fedora, CentOS)"
        - "SUSE"
        - "other / not sure"
    validations:
      required: true

  - type: input
    id: ansible
    attributes:
      label: ansible-core version
      description: "`ansible --version`. This fork is tested against 2.17 and 2.18."
      placeholder: "2.18.1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the failing task and its output. Trim it to the relevant part.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can this be reproduced?
      description: >-
        The playbook or variables that trigger it. A minimal case is much more
        useful than a complete inventory.
      render: yaml

  - type: dropdown
    id: upstream
    attributes:
      label: Have you checked upstream?
      description: >-
        Optional, and not a prerequisite. Most role and module code comes from
        `grafana/grafana-ansible-collection`, so knowing whether the problem
        exists there too helps place the fix — but upstream's maintainership is
        currently dormant, so do not wait on it.
      options:
        - "Not checked"
        - "Also affects upstream"
        - "Specific to this fork"
        - "There is already an upstream issue or PR (link it below)"

  - type: textarea
    id: context
    attributes:
      label: Anything else?
