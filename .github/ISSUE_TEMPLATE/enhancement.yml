---
name: Enhancement
description: Propose a change or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Contributions are welcome and they belong here — you do not need to open
        anything upstream first. See
        [CONTRIBUTING.md](https://github.com/no42-org/grafana-ansible-collection/blob/main/CONTRIBUTING.md).

        Two things this fork does **not** take: new roles, and large features.
        It is a curated downstream rather than a place to grow the collection.

  - type: dropdown
    id: area
    attributes:
      label: What does this affect?
      options:
        - "an existing role"
        - "an existing module"
        - "the release pipeline or packaging"
        - "the role test harness"
        - "documentation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you are in, not the change you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to implement it?
      options:
        - label: "I would like to open a pull request for this"
