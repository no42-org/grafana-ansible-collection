---
name: Role Test

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main"]
    paths:
      - 'roles/**'
      - 'tests/roles/**'
      - 'tools/role-test.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/role-test.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'roles/**'
      - 'tests/roles/**'
      - 'tools/role-test.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/role-test.yml'

permissions:
  contents: read

# uv's own version. This workflow is not called through gate.yml and cannot
# inherit its `env:`, so this is the second place the value appears.
# tools/lint-release.sh fails `make ci-lint-release` if the two disagree.
env:
  UV_VERSION: '0.12.7'

concurrency:
  group: role-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-test:
    name: ${{ matrix.role }} (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both package families for every role. The rhel entry is not symmetry:
        # the grafana role's yum/dnf block, and the carried contributions #534
        # and #538 inside it, are unreachable on Debian.
        role:
          - grafana
          - opentelemetry_collector
          - mimir
          - loki
          - alloy
          - tempo
        distro:
          - debian
          - rhel

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No setup-python and no `pip install ansible-core`. The harness runs
      # ansible-playbook through `uv run --group ansible`, the one declaration
      # of the ansible-core version in pyproject.toml, and uv provisions an
      # interpreter that satisfies requires-python. The pair this replaces was
      # a pinned ansible-core against a separately pinned Python, which is the
      # shape that broke the Molecule workflows: python-version '3.x' resolved
      # to 3.14, ansible-core was pinned to 2.16, and ansible-compat refused
      # the pair at import. uv.lock now resolves both together.
      #
      # The harness also installs tests/roles/requirements.yml itself, so the
      # collections are no longer a separate step here that a local run lacks.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: role-test

      # CI calls the Makefile target, never the script directly, so local and
      # CI cannot drift.
      - name: Role test
        run: make role-test ROLE=${{ matrix.role }} DISTRO=${{ matrix.distro }}

      - name: Show the logs on failure
        if: failure()
        run: |
          for log in build/role-test/*/*.log; do
            echo "::group::${log}"
            tail -80 "${log}"
            echo "::endgroup::"
          done

  # The top of the claimed range, sampled.
  #
  # meta/runtime.yml claims requires_ansible ">=2.17.0,<3.0.0". The matrix
  # above executes 2.18, and until this job existed nothing executed anything
  # newer: the sanity matrix covers 2.17, 2.18 and devel, and sanity is static.
  # A consumer on the newest release was the first to run the roles on it.
  #
  # A sample, not a second matrix. Twelve more jobs on the slowest gate is a
  # real cost, and the claim under test, "the roles work at the top of the
  # range", does not need every role on every package family. The roles here
  # are chosen for version sensitivity, measured as task count and distinct
  # modules used, not for speed:
  #
  #   grafana   85 tasks, 29 modules, the only role with a yum/dnf path and
  #             the most inherited task logic. Both families, because the
  #             package-manager block is unreachable on Debian.
  #   alloy     65 tasks, 21 modules, and this fork's replacement for the two
  #             removed roles. No package-manager branching, so one family.
  #
  # Omitted: loki, mimir, tempo, opentelemetry_collector, at 19 to 34 tasks and
  # 11 to 15 modules each, most of them the same modules grafana already
  # exercises. A regression confined to one of them on the newest ansible would
  # pass this job. That is the difference between evidence and proof, and it is
  # recorded in RELEASING.md.
  #
  # The version is pinned in pyproject.toml's ansible-top group and moves only
  # by commit. The job carries no version of its own.
  role-test-top:
    name: ${{ matrix.role }} (${{ matrix.distro }}) on newest ansible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: grafana
            distro: debian
          - role: grafana
            distro: rhel
          - role: alloy
            distro: debian

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: role-test-top

      - name: Role test
        run: make role-test ROLE=${{ matrix.role }} DISTRO=${{ matrix.distro }} ANSIBLE_GROUP=ansible-top

      - name: Show the logs on failure
        if: failure()
        run: |
          for log in build/role-test/*/*.log; do
            echo "::group::${log}"
            tail -80 "${log}"
            echo "::endgroup::"
          done
