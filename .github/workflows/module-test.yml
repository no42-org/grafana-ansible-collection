---
name: Module Test

# The plugin modules, against a running Grafana.
#
# Its own workflow rather than a job in role-test.yml, because path filters are
# per workflow: adding 'plugins/**' there would fire fifteen role jobs on a
# change that cannot affect a role, and the whole reason both workflows are
# filtered is that they are the slow ones.
#
# Not called through gate.yml. gate.yml is what must pass to release and
# provisions no containers; this needs docker, like the role tests, and is
# filtered to the paths it covers.
#
# Filtered to everything it reads, not just its own script: it sources
# tools/includes/utils.sh and logging.sh, CI invokes it through the Makefile,
# it reads the namespace out of galaxy.yml to build the collection symlink, and
# roles/grafana/defaults/main.yml is the version under test. A path the harness depends on and the filter omits is a gate that
# disappears exactly when someone changes the thing that could break it.

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main"]
    # One list, anchored, as codeql.yml already does: two copies of a filter
    # drift, and a drifted filter fires on one event and not the other.
    paths: &module_test_paths
      - 'plugins/**'
      - 'tests/modules/**'
      - 'tools/module-test.sh'
      # Coarse on purpose; see the same entry in role-test.yml.
      - 'tools/includes/**'
      - 'Makefile'
      - 'galaxy.yml'
      # Not load-bearing for this harness -- module-test.sh exports
      # ANSIBLE_COLLECTIONS_PATH, which overrides ansible.cfg's
      # collections_path -- and kept anyway, because the day that export is
      # removed this file decides where the collection resolves from, and a
      # filter that over-fires costs one job.
      - 'ansible.cfg'
      - 'roles/grafana/defaults/main.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/module-test.yml'
  pull_request:
    branches: ["main"]
    paths: *module_test_paths

permissions:
  contents: read

# uv's own version. This workflow is not called through gate.yml and cannot
# inherit its `env:`, so this is the third place the value appears.
# tools/lint-release.sh fails `make ci-lint-release` if the workflows disagree.
env:
  UV_VERSION: '0.12.7'

concurrency:
  group: module-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - datasource

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No setup-python and no `pip install ansible-core`, for the reason
      # role-test.yml gives at length: the harness runs ansible-playbook
      # through `uv run --group module-test`, which is the one declaration of
      # both the ansible-core version and the requests the modules import.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: module-test

      # No collection cache, unlike the role tests: this harness installs
      # nothing from galaxy. The scenario reaches Grafana over HTTP with
      # ansible.builtin.uri, so there is no connection plugin to fetch.
      #
      # CI calls the Makefile target, never the script directly, so local and
      # CI cannot drift. The Grafana version comes from the role's pin.
      - name: Module test
        run: make module-test MODULE=${{ matrix.module }}

      - name: Show the logs on failure
        if: failure()
        run: |
          # nullglob: a run that failed before writing a log must not turn
          # this step into a second failure about a literal '*.log'.
          shopt -s nullglob
          for log in build/module-test/*/*.log; do
            echo "::group::${log}"
            tail -80 "${log}"
            echo "::endgroup::"
          done
