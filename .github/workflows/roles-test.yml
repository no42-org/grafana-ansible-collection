---
name: Roles Test

# Manual trigger only.
#
# Two reasons, both inherited:
#   - every job here targets `ubuntu-20.04`, a runner label GitHub has retired,
#     so on push these jobs sat `queued` forever and appeared as checks that
#     could never resolve;
#   - the integration jobs need Grafana Cloud secrets this fork does not hold,
#     which is the same reason `integration` was removed from the release
#     pipeline.
#
# Kept rather than deleted: this is the only module-level integration suite in
# the repository, and it becomes useful again if those credentials ever exist.
# Following the precedent already set by full-integration-test.yml.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

# Least privilege. Nothing here writes to the repository, so read is the whole
# requirement. A job-level block would replace this one rather than merge with
# it, so no job declares one.
permissions:
  contents: read

concurrency:
  group: roles-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NAMESPACE: grafana
  COLLECTION_NAME: grafana

jobs:

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      matrix:
        ansible:
          - stable-2.12
          - stable-2.13
          - stable-2.14
          - devel
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity -v --docker --color --coverage
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    name: Integration (Ⓐ${{ matrix.ansible }}-py${{ matrix.python }})
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        ansible:
          - stable-2.13
        python:
          - '3.10'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: create integration_config
        working-directory: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}/tests/integration
        run: |
          cat <<EOF > integration_config.yml
          stack_name: ${{ secrets.ANSIBLE_TEST_STACK_NAME }}
          org_name: ${{ secrets.ANSIBLE_TEST_ORG_NAME }}
          grafana_cloud_api_key: ${{ secrets.ANSIBLE_TEST_CLOUD_API_KEY }}
          grafana_api_key: ${{ secrets.ANSIBLE_TEST_GRAFANA_API_KEY }}
          grafana_url: ${{ secrets.ANSIBLE_GRAFANA_URL }}
          test_stack_name: ${{ secrets.ANSIBLE_TEST_CI_STACK }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Install Requests
        run: pip install requests

      - name: Test Roles
        run: ansible-test integration -v molecule-grafana-alternative molecule-grafana-default --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
