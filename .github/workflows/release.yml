---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v*'

# The "v" prefix is load-bearing. Upstream's tags are bare (6.0.3 ... 6.1.0),
# they are already present in this fork, and more arrive on every
# `git fetch upstream --tags`. A pattern like '*' or '[0-9]*' would let an
# upstream tag fetch fire a release.

# Least privilege. Only the `release` job elevates, to create the GitHub
# release; every other job needs no more than read. A job-level block replaces
# this one rather than merging with it, so an elevated job must list every
# scope it needs, `contents` included.
permissions:
  contents: read

# cancel-in-progress is deliberately false. A cancelled release publishes half
# of itself: Galaxy versions are immutable, so an upload that lands without the
# GitHub release and its notes cannot be redone under the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The namespace in the working tree. The rename to indigo423 happens inside
  # `make dist`; ansible-test still needs the tree at its source path.
  SOURCE_NAMESPACE: grafana
  COLLECTION_NAME: grafana
  GALAXY_NAMESPACE: indigo423
  GALAXY_SERVER: https://galaxy.ansible.com/api/

jobs:
  verify-version:
    name: Verify tag matches galaxy.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      # Runs before anything is built or published. Galaxy versions are
      # immutable, so a mismatched tag must cost seconds, not a bad upload.
      - name: Compare tag against galaxy.yml
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GALAXY_VERSION="$(python -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          echo "tag:        ${GITHUB_REF_NAME} -> ${TAG_VERSION}"
          echo "galaxy.yml: ${GALAXY_VERSION}"
          if [ "${TAG_VERSION}" != "${GALAXY_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${GALAXY_VERSION}"
            exit 1
          fi
          echo "version=${GALAXY_VERSION}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint release machinery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify-version]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          wget -c https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz -O shellcheck.tar.xz && \
            tar -xvf shellcheck.tar.xz && \
            sudo mv ./shellcheck-v0.9.0/shellcheck /usr/bin/shellcheck && \
            rm -rf shellcheck-v0.9.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Pinned, both of them. An unpinned linter is a gate that can change
      # what it demands without anyone changing the repository.
      - name: Install yamllint and zizmor
        run: pip install 'yamllint==1.38.0' 'zizmor==1.30.1'

      # Version-pinned, like shellcheck above. actionlint is what catches the
      # things yamllint cannot: bad expressions, unknown contexts, broken
      # `needs:` graphs, and retired runner labels. tools/lint-release.sh now
      # requires it rather than skipping when it is absent, so this step is
      # load-bearing.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          wget -q "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -O actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/bin/actionlint
          rm -f actionlint.tar.gz
          actionlint --version

      # Scoped to the release machinery on purpose: tools/*.sh, galaxy.yml,
      # dependabot.yml, and every workflow's hygiene (pinning, expressions,
      # runner labels). It is not the full `make ci-lint` set, which is red on a
      # pristine tree from findings inherited from upstream -- fixing those is
      # the `honest-ci-gates` change. See tools/lint-release.sh.
      #
      # CI calls a Makefile target, never the tooling directly, so local and CI
      # linting cannot drift.
      - name: Lint
        run: make ci-lint-release

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [verify-version]
    # devel is advisory. It tracks unreleased ansible-core and breaks for
    # reasons unrelated to this collection; a release must not stop for that.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.17
            python: '3.11'
            experimental: false
          - ansible: stable-2.18
            python: '3.11'
            experimental: false
          - ansible: devel
            python: '3.12'
            experimental: true
    steps:
      # ansible-test requires the collection to live at
      # ansible_collections/<namespace>/<name>. The tree is unrenamed here, so
      # that is the source namespace, not the Galaxy one.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: ansible_collections/${{ env.SOURCE_NAMESPACE }}/${{ env.COLLECTION_NAME }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity -v --docker --color
        working-directory: ./ansible_collections/${{ env.SOURCE_NAMESPACE }}/${{ env.COLLECTION_NAME }}

  build:
    name: Build collection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, sanity]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install ansible-core

      # Copies the tree to build/src, rewrites the namespace there, asserts the
      # rewrite count, and packages. The working tree is never modified.
      - name: Build
        run: make dist

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: collection
          path: build/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test the built artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [verify-version, build]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # This gate is why the build-time rename is safe. Every in-tree test
      # exercises grafana.grafana, so a rename bug is invisible to the whole
      # test suite and would only surface after the version is immutable on
      # Galaxy. Here the real artifact is installed and the renamed names are
      # resolved for real.
      - name: Install the built collection
        run: |
          ansible-galaxy collection install \
            "dist/${GALAXY_NAMESPACE}-${COLLECTION_NAME}-${{ needs.verify-version.outputs.version }}.tar.gz" \
            -p ./collections

      # A wrong namespace in galaxy.yml lands the collection elsewhere.
      - name: Assert install path
        run: |
          INSTALLED="collections/ansible_collections/${GALAXY_NAMESPACE}/${COLLECTION_NAME}"
          if [ ! -d "${INSTALLED}" ]; then
            echo "::error::collection not installed at ${INSTALLED}"
            find collections/ansible_collections -maxdepth 2 -type d
            exit 1
          fi
          echo "installed at ${INSTALLED}"

      - name: Assert modules resolve under the new namespace
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: |
          for module in dashboard datasource folder user alert_contact_point \
                        alert_notification_policy cloud_api_key cloud_plugin cloud_stack; do
            echo "--- ${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${module}"
            ansible-doc "${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${module}" > /dev/null
          done

      - name: Assert roles resolve under the new namespace
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: |
          {
            echo "---"
            echo "- name: Resolve every role by its renamed FQCN"
            echo "  hosts: localhost"
            echo "  gather_facts: false"
            echo "  roles:"
            for role in alloy grafana grafana_agent loki mimir \
                        opentelemetry_collector promtail tempo; do
              echo "    - ${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${role}"
            done
          } > resolve-roles.yml
          cat resolve-roles.yml
          # --syntax-check resolves every role without running any task.
          ansible-playbook --syntax-check resolve-roles.yml

      - name: Assert the rename did not corrupt community.grafana references
        run: |
          INSTALLED="collections/ansible_collections/${GALAXY_NAMESPACE}/${COLLECTION_NAME}"
          # community.grafana.grafana_datasource contains "grafana.grafana" as a
          # substring; a naive rewrite turns it into a collection that does not
          # exist, in runtime code, where no build step would notice.
          if grep -rIq "community\.${GALAXY_NAMESPACE}\." "${INSTALLED}"; then
            echo "::error::rename corrupted a community.grafana reference"
            grep -rIn "community\.${GALAXY_NAMESPACE}\." "${INSTALLED}"
            exit 1
          fi
          for expected in community.grafana.grafana_datasource community.grafana.grafana_dashboard; do
            if ! grep -rIq "${expected}" "${INSTALLED}"; then
              echo "::error::expected ${expected} to survive the rename"
              exit 1
            fi
            echo "ok ${expected}"
          done

  publish:
    name: Publish to Galaxy
    runs-on: ubuntu-24.04
    needs: [verify-version, smoke]
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # Galaxy's publish is asynchronous: the upload returns, then an import
      # task runs and can still reject the collection. `ansible-galaxy
      # collection publish` waits for that import and exits non-zero if it
      # fails -- so do NOT add --no-wait here. A successful upload is not a
      # successful release.
      - name: Publish
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "::error::the GALAXY_API_KEY secret is not configured"
            exit 1
          fi
          ansible-galaxy collection publish \
            --server "${GALAXY_SERVER}" \
            --api-key "${GALAXY_API_KEY}" \
            "dist/${GALAXY_NAMESPACE}-${COLLECTION_NAME}-${{ needs.verify-version.outputs.version }}.tar.gz"

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify-version, publish]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # This fork's version numbers are its own, so the notes have to say so and
      # name the upstream commit the release was built from. Without both, the
      # number is ambiguous against an upstream release of the same name.
      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          git remote add upstream https://github.com/grafana/grafana-ansible-collection.git 2>/dev/null || true
          git fetch -q --no-tags upstream main
          UPSTREAM_BASE="$(git merge-base HEAD upstream/main)"
          {
            echo "Release of \`${GALAXY_NAMESPACE}.${COLLECTION_NAME}\` version \`${VERSION}\`."
            echo ""
            echo "Install with:"
            echo ""
            echo '```'
            echo "ansible-galaxy collection install ${GALAXY_NAMESPACE}.${COLLECTION_NAME}:${VERSION}"
            echo '```'
            echo ""
            echo "## Provenance"
            echo ""
            echo "This version number is this fork's own."
            echo "It does **not** correspond to a \`grafana.grafana\` release of the same number."
            echo ""
            echo "Built from upstream commit \`${UPSTREAM_BASE}\`."
            echo ""
            echo "## Upstream contributions carried in this release"
            echo ""
            echo "Cherry-picked from open, unmerged upstream pull requests, with their authors preserved."
            echo "Each is dropped once upstream merges it."
            echo ""
            ./tools/carried-prs.sh --release-notes "${UPSTREAM_BASE}"
            echo ""
            echo "Published to https://galaxy.ansible.com/ui/repo/published/${GALAXY_NAMESPACE}/${COLLECTION_NAME}/"
          } > release-notes.md
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.verify-version.outputs.version }}
          body_path: release-notes.md
          files: dist/*.tar.gz
