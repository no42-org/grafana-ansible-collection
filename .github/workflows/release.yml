---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v*'

# The "v" prefix is load-bearing. Upstream's tags are bare (6.0.3 ... 6.1.0),
# they are already present in this fork, and more arrive on every
# `git fetch upstream --tags`. A pattern like '*' or '[0-9]*' would let an
# upstream tag fetch fire a release.

# Least privilege. Only the `release` job elevates, to create the GitHub
# release; every other job needs no more than read. A job-level block replaces
# this one rather than merging with it, so an elevated job must list every
# scope it needs, `contents` included.
permissions:
  contents: read

# cancel-in-progress is deliberately false. A cancelled release publishes half
# of itself: Galaxy versions are immutable, so an upload that lands without the
# GitHub release and its notes cannot be redone under the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # uv's own version, the one tool a workflow must name because it installs
  # everything else. gate.yml and role-test.yml declare the same value;
  # tools/lint-release.sh fails `make ci-lint-release` if any two disagree.
  UV_VERSION: '0.12.7'
  # The namespace in the working tree. The rename to indigo423 happens inside
  # `make dist`; ansible-test still needs the tree at its source path.
  SOURCE_NAMESPACE: grafana
  COLLECTION_NAME: grafana
  GALAXY_NAMESPACE: indigo423
  GALAXY_SERVER: https://galaxy.ansible.com/api/

jobs:
  verify-version:
    name: Verify tag matches galaxy.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No setup-python and no `pip install pyyaml`. PyYAML arrives as a
      # dependency of ansible-core in pyproject.toml's `ansible` group, with
      # its hash in uv.lock, which is a stronger pin than the `==6.0.3` this
      # replaces and one fewer version declared in a workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # No cache, unlike gate.yml and role-test.yml. This workflow publishes
          # what it builds, and a restored cache is an input to that artifact
          # which nobody reviewed. zizmor reports it as cache poisoning, and it
          # is right. A release runs rarely enough that the cache saved nothing.
          enable-cache: false

      # Runs before anything is built or published. Galaxy versions are
      # immutable, so a mismatched tag must cost seconds, not a bad upload.
      - name: Compare tag against galaxy.yml
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GALAXY_VERSION="$(uv run --frozen --group ansible python -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          echo "tag:        ${GITHUB_REF_NAME} -> ${TAG_VERSION}"
          echo "galaxy.yml: ${GALAXY_VERSION}"
          if [ "${TAG_VERSION}" != "${GALAXY_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${GALAXY_VERSION}"
            exit 1
          fi
          echo "version=${GALAXY_VERSION}" >> "$GITHUB_OUTPUT"

          # A semver pre-release carries a hyphen after the patch number:
          # 7.1.0-rc1, 7.1.0-beta.2. This is for a genuine release candidate
          # that consumers install by name; it is not a rehearsal step, and
          # RELEASING.md says why. Galaxy already treats such a version as a
          # pre-release and will not resolve it for a plain
          # `ansible-galaxy collection install indigo423.grafana`. GitHub does
          # not infer it, so without this the candidate would take over
          # "Latest release" on the repository page.
          if [ "${GALAXY_VERSION}" != "${GALAXY_VERSION%%-*}" ]; then
            echo "pre-release: yes (${GALAXY_VERSION})"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre-release: no"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The shared gate, the same jobs ci.yml runs on every pull request. Before
  # this, release.yml defined its own lint and sanity and nothing kept the two
  # definitions in agreement -- so a release could publish through a weaker
  # gate than pull requests enforce.
  #
  # It also widens what the release checks: the gate runs the full collection
  # lint set, not just the release machinery. `honest-ci-gates` recorded that
  # as blocked on the pipenv toolchain, which was wrong -- `make install` has
  # succeeded on every CI run, because setup-python supplies the Python 3.10
  # that Pipfile pins and a maintainer's machine may lack. The fragility is
  # local, not in CI.
  gate:
    name: Gate
    needs: [verify-version]
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
    with:
      source-namespace: grafana
      collection-name: grafana

  build:
    name: Build collection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [gate]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ansible-core comes from pyproject.toml's `ansible` group, the one
      # declaration the gates and the role tests already run on, so the tooling
      # that builds, installs and verifies the artifact is the tooling the
      # artifact was tested with. This step used to pin `~=2.18.0` itself, one
      # of five restatements of that fact, and an unconstrained
      # `pip install ansible-core` resolved 2.21.4. The collection's own
      # requires_ansible is what consumers may use, not what this pipeline
      # should pick at random.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # No cache, unlike gate.yml and role-test.yml. This workflow publishes
          # what it builds, and a restored cache is an input to that artifact
          # which nobody reviewed. zizmor reports it as cache poisoning, and it
          # is right. A release runs rarely enough that the cache saved nothing.
          enable-cache: false

      # Copies the tree to build/src, rewrites the namespace there, asserts the
      # rewrite count, and packages. The working tree is never modified.
      - name: Build
        run: make dist

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: collection
          path: build/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test the built artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [verify-version, build]
    steps:
      # The checkout is for pyproject.toml and uv.lock, so ansible-core can be
      # resolved from the declared group. Nothing under test is read from the
      # tree: the artifact is installed to ./collections and every assertion
      # points ANSIBLE_COLLECTIONS_PATH at it.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ansible-core comes from pyproject.toml's `ansible` group, the one
      # declaration the gates and the role tests already run on, so the tooling
      # that builds, installs and verifies the artifact is the tooling the
      # artifact was tested with. This step used to pin `~=2.18.0` itself, one
      # of five restatements of that fact, and an unconstrained
      # `pip install ansible-core` resolved 2.21.4. The collection's own
      # requires_ansible is what consumers may use, not what this pipeline
      # should pick at random.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # No cache, unlike gate.yml and role-test.yml. This workflow publishes
          # what it builds, and a restored cache is an input to that artifact
          # which nobody reviewed. zizmor reports it as cache poisoning, and it
          # is right. A release runs rarely enough that the cache saved nothing.
          enable-cache: false

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # This gate is why the build-time rename is safe. Every in-tree test
      # exercises grafana.grafana, so a rename bug is invisible to the whole
      # test suite and would only surface after the version is immutable on
      # Galaxy. Here the real artifact is installed and the renamed names are
      # resolved for real.
      - name: Install the built collection
        run: |
          uv run --frozen --group ansible ansible-galaxy collection install \
            "dist/${GALAXY_NAMESPACE}-${COLLECTION_NAME}-${{ needs.verify-version.outputs.version }}.tar.gz" \
            -p ./collections

      # A wrong namespace in galaxy.yml lands the collection elsewhere.
      - name: Assert install path
        run: |
          INSTALLED="collections/ansible_collections/${GALAXY_NAMESPACE}/${COLLECTION_NAME}"
          if [ ! -d "${INSTALLED}" ]; then
            echo "::error::collection not installed at ${INSTALLED}"
            find collections/ansible_collections -maxdepth 2 -type d
            exit 1
          fi
          echo "installed at ${INSTALLED}"

      - name: Assert modules resolve under the new namespace
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: |
          for module in dashboard datasource folder user alert_contact_point \
                        alert_notification_policy cloud_api_key cloud_plugin cloud_stack; do
            echo "--- ${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${module}"
            uv run --frozen --group ansible ansible-doc "${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${module}" > /dev/null
          done

      - name: Assert roles resolve under the new namespace
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: |
          {
            echo "---"
            echo "- name: Resolve every role by its renamed FQCN"
            echo "  hosts: localhost"
            echo "  gather_facts: false"
            echo "  roles:"
            for role in alloy grafana loki mimir \
                        opentelemetry_collector tempo; do
              echo "    - ${GALAXY_NAMESPACE}.${COLLECTION_NAME}.${role}"
            done
          } > resolve-roles.yml
          cat resolve-roles.yml
          # --syntax-check resolves every role without running any task.
          uv run --frozen --group ansible ansible-playbook --syntax-check resolve-roles.yml

      - name: Assert the rename did not corrupt community.grafana references
        run: |
          INSTALLED="collections/ansible_collections/${GALAXY_NAMESPACE}/${COLLECTION_NAME}"
          # community.grafana.grafana_datasource contains "grafana.grafana" as a
          # substring; a naive rewrite turns it into a collection that does not
          # exist, in runtime code, where no build step would notice.
          if grep -rIq "community\.${GALAXY_NAMESPACE}\." "${INSTALLED}"; then
            echo "::error::rename corrupted a community.grafana reference"
            grep -rIn "community\.${GALAXY_NAMESPACE}\." "${INSTALLED}"
            exit 1
          fi
          for expected in community.grafana.grafana_datasource community.grafana.grafana_dashboard; do
            if ! grep -rIq "${expected}" "${INSTALLED}"; then
              echo "::error::expected ${expected} to survive the rename"
              exit 1
            fi
            echo "ok ${expected}"
          done

  publish:
    name: Publish to Galaxy
    runs-on: ubuntu-24.04
    needs: [verify-version, smoke]
    timeout-minutes: 30
    steps:
      # The checkout is for pyproject.toml and uv.lock, nothing else.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ansible-core comes from pyproject.toml's `ansible` group, the one
      # declaration the gates and the role tests already run on, so the tooling
      # that builds, installs and verifies the artifact is the tooling the
      # artifact was tested with. This step used to pin `~=2.18.0` itself, one
      # of five restatements of that fact, and an unconstrained
      # `pip install ansible-core` resolved 2.21.4. The collection's own
      # requires_ansible is what consumers may use, not what this pipeline
      # should pick at random.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # No cache, unlike gate.yml and role-test.yml. This workflow publishes
          # what it builds, and a restored cache is an input to that artifact
          # which nobody reviewed. zizmor reports it as cache poisoning, and it
          # is right. A release runs rarely enough that the cache saved nothing.
          enable-cache: false

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # Galaxy's publish is asynchronous: the upload returns, then an import
      # task runs and can still reject the collection. `ansible-galaxy
      # collection publish` waits for that import and exits non-zero if it
      # fails -- so do NOT add --no-wait here. A successful upload is not a
      # successful release.
      - name: Publish
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "::error::the GALAXY_API_KEY secret is not configured"
            exit 1
          fi
          uv run --frozen --group ansible ansible-galaxy collection publish \
            --server "${GALAXY_SERVER}" \
            --api-key "${GALAXY_API_KEY}" \
            "dist/${GALAXY_NAMESPACE}-${COLLECTION_NAME}-${{ needs.verify-version.outputs.version }}.tar.gz"

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify-version, publish]
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download collection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: collection
          path: dist

      # This fork's version numbers are its own, so the notes have to say so and
      # name the upstream commit the release was built from. Without both, the
      # number is ambiguous against an upstream release of the same name.
      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          git remote add upstream https://github.com/grafana/grafana-ansible-collection.git 2>/dev/null || true
          git fetch -q --no-tags upstream main
          UPSTREAM_BASE="$(git merge-base HEAD upstream/main)"
          {
            echo "Release of \`${GALAXY_NAMESPACE}.${COLLECTION_NAME}\` version \`${VERSION}\`."
            echo ""
            if [ "${PRERELEASE}" = "true" ]; then
              echo "> **Pre-release.** Galaxy will not resolve this version for a plain"
              echo "> \`ansible-galaxy collection install ${GALAXY_NAMESPACE}.${COLLECTION_NAME}\`;"
              echo "> it has to be asked for by name. Install it only to test it."
              echo ""
            fi
            echo "Install with:"
            echo ""
            echo '```'
            echo "ansible-galaxy collection install ${GALAXY_NAMESPACE}.${COLLECTION_NAME}:${VERSION}"
            echo '```'
            echo ""
            echo "## Provenance"
            echo ""
            echo "This version number is this fork's own."
            echo "It does **not** correspond to a \`grafana.grafana\` release of the same number."
            echo ""
            echo "Built from upstream commit \`${UPSTREAM_BASE}\`."
            echo ""
            echo "## Upstream contributions carried in this release"
            echo ""
            echo "Cherry-picked from open, unmerged upstream pull requests, with their authors preserved."
            echo "Each is dropped once upstream merges it."
            echo ""
            ./tools/carried-prs.sh --release-notes "${UPSTREAM_BASE}"
            echo ""
            echo "Published to https://galaxy.ansible.com/ui/repo/published/${GALAXY_NAMESPACE}/${COLLECTION_NAME}/"
          } > release-notes.md
          cat release-notes.md

      # prerelease is load-bearing, not decoration: it is what keeps a
      # genuine release candidate such as v7.1.0-rc1 from moving "Latest
      # release" on the repository page, which is the first thing a reader
      # uses to decide what to install.
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.verify-version.outputs.version }}
          body_path: release-notes.md
          files: dist/*.tar.gz
          prerelease: ${{ needs.verify-version.outputs.prerelease }}
          make_latest: ${{ needs.verify-version.outputs.prerelease == 'false' }}
