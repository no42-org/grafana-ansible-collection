---
name: Promtail Molecule

# Manual trigger only, and currently unable to pass.
#
# The promtail role cannot install its software: Grafana stopped shipping
# promtail packages after loki v3.6.0, and promtail_version defaults to
# `latest`, which resolves to a release with zero promtail assets. Every
# architecture 404s.
#
# So this is not replaced by tests/roles/promtail — there is nothing to
# replace it with until the role is fixed or retired. Left here, manual-only,
# so the scenario survives for whoever takes that decision.
#
# Off push and pull_request because a check that can never go green teaches
# people to ignore checks.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: roles/promtail

jobs:
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - rockylinux9
          - ubuntu2204
          - debian12

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
