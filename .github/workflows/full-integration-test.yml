---
name: Full Integration Test

# Manual trigger only, matching modules-test.yml and roles-test.yml, which
# cite this file as the precedent for being dispatch-only. It was not actually
# dispatch-only: a weekly cron remained, and because the job targeted the
# retired `ubuntu-20.04` label it sat `queued` indefinitely rather than
# failing. Pinning the runner fixes the queueing and would have turned it into
# a weekly *failing* run instead: the integration jobs need Grafana Cloud
# secrets this fork does not hold, and the matrix targets Python 2.7 through
# 3.10 against ansible stable-2.11 to devel.
#
# Kept rather than deleted, for the same reason as the other two: it becomes
# useful again if those credentials ever exist. Runner pinned to ubuntu-22.04
# rather than 24.04 because the old Python versions in the matrix are likelier
# to resolve there.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

# Least privilege. Nothing here writes to the repository, so read is the whole
# requirement. A job-level block would replace this one rather than merge with
# it, so no job declares one.
permissions:
  contents: read

concurrency:
  group: full-integration-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NAMESPACE: grafana
  COLLECTION_NAME: grafana

jobs:

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    name: ${{ matrix.ansible }}-py${{ matrix.python }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        ansible:
          - stable-2.11
          - stable-2.12
          - stable-2.13
          - devel
        python:
          - '2.7'
          - '3.5'
          - '3.6'
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
        exclude:
          - ansible: stable-2.11
            python: '3.10'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: create integration_config
        working-directory: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}/tests/integration
        run: |
          cat <<EOF > integration_config.yml
          stack_name: ${{ secrets.ANSIBLE_TEST_STACK_NAME }}
          org_name: ${{ secrets.ANSIBLE_TEST_ORG_NAME }}
          grafana_cloud_api_key: ${{ secrets.ANSIBLE_TEST_CLOUD_API_KEY }}
          grafana_api_key: ${{ secrets.ANSIBLE_TEST_GRAFANA_API_KEY }}
          test_stack_name: ${{ secrets.ANSIBLE_TEST_CI_STACK }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Test Modules
        run: ansible-test integration -v alert_contact_point alert_notification_policy cloud_api_key cloud_plugin cloud_stack dashboard datasource folder --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: Cooling Period
        run: sleep 3m
