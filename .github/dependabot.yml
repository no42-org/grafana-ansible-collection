# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2
updates:
  # uv, not pip. `pip` pointed at the Pipfile that modernize-lint-toolchain
  # deleted when it replaced pipenv, so there was no version-updates entry for
  # the ecosystem Dependabot actually finds -- and every security-update run
  # failed as a result, with `uv in /.` in its own title.
  #
  # Covers pyproject.toml's `lint` dependency group and uv.lock. None of it
  # ships: build_ignore keeps both out of the published collection.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the SHA pins in .github/workflows current. Dependabot rewrites both
  # the SHA and the trailing full-semver comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # package.json carries the markdown and prose linters. It has no lockfile,
  # so Dependabot updates the ranges in the manifest. If
  # modernize-lint-toolchain retires the Node toolchain, this block goes with
  # it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
