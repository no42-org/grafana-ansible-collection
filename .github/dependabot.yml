# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Keeps the SHA pins in .github/workflows current. Dependabot rewrites both
  # the SHA and the trailing full-semver comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # package.json carries the markdown and prose linters. It has no lockfile,
  # so Dependabot updates the ranges in the manifest. If
  # modernize-lint-toolchain retires the Node toolchain, this block goes with
  # it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
