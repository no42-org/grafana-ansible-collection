  - id: L2
    slug: lint-toolchain-and-ci
    group: toolchain
    epic: "-"
    title: Pinned lint toolchain and one shared CI gate
    summary: |
      The lint toolchain needed pipenv and Node, and its tools ran different versions locally and in CI.
      Some gates exited 0 when their tool could not run.
      The workflows used mutable action tags and broad permissions.

      Every linter is now provisioned through uv or a checksum-verified download, with one version definition per tool.
      Markdown and text linting run on rumdl and codespell, and the Node toolchain is gone.
      A gate that cannot run says TOOLCHAIN NOT INSTALLED instead of passing.
      CI calls one reusable gate workflow, every action is pinned to a SHA, and permissions are least privilege.
      CodeQL, dependency review and Scorecard scan the repository.
      The Molecule-era workflows that could no longer run are removed.

      It also stops shipping requirements.txt with this repository's linters in it, and declares requests, the one library the modules import.
