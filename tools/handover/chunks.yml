  - id: F8
    slug: module-refusals
    group: fixes
    epic: grafana-api-modules
    title: Modules report refusals with their HTTP status
    summary: |
      Eight modules built their failure message from result.json()['message'].
      A refusal without that key raised KeyError, and one that was not JSON raised a decode error, so the status was lost.
      Seven lookups read the body as data without checking the status first.
      state=absent failed or reported a change for a resource that did not exist.

      plugins/module_utils/responses.py now holds one rule for turning a response into a failure, and every module uses it.
      Lookups check the status before reading the body, and only 401 and 403 are treated as not changed yet.
      state=absent on a missing resource reports ok, and folder matches on uid alone, as its DELETE does.
    commits:
