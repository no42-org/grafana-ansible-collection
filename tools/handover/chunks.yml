chunks:
  # ------------------------------------------------------------- harness
  - id: T1
    slug: role-test-harness
    group: harness
    epic: cross-role
    title: Container role tests replacing Molecule
    summary: |
      The roles had Molecule scenarios that no workflow could run any more, so no role change was tested against a real host.
      Several roles had broken against newer releases of the software they install, and nothing noticed.

      This chunk adds tools/role-test.sh and make role-test ROLE=<role> DISTRO=debian|rhel.
      Each run starts a fresh container and applies the role twice: converge, then an idempotence pass that fails on any changed task, then verify.
      Scenarios live in tests/roles/<role>/, and mimir gets a three-node topology with a MinIO sidecar.
      The ansible-core version comes from a uv dependency group in pyproject.toml, so a local run and a CI run use the same engine.
      Collections are installed once per job with retries, so a job does not depend on galaxy.ansible.com being up.

      It also removes the five per-role Molecule workflows that the harness replaces.
      The grafana, mimir and opentelemetry_collector scenarios assert carried fixes, so they pass once the chunks that carry those fixes are applied.
    commits:
      - "f79318fb"
      - "66165481"
      - "81651a2c"
      - "dcd3d5f5"
      - "818adcf7"
      - "81562fda"
      - "2e6b5dd1"
      - "93262eb4"
      - "c5973b7d"
      - "13106310"
    seed_notes: |
      2e6b5dd1: keep only what the harness needs.
      That is pyproject.toml with the ansible group, uv.lock, and the .venv line in .gitignore.
      It also takes the pyproject.toml, uv.lock and .venv lines in galaxy.yml's build_ignore.
      Keep Pipfile, Pipfile.lock and upstream's lint scripts as they are, because upstream's lint still runs on pipenv at this point.
      Author the lint-script, tools/setup.sh, tools/includes/lint-paths.sh, .yamllint, .ansible-lint and Makefile lint hunks onto L2.
      Drop the gate.yml, lint-release.sh and rename-namespace.sh hunks.
      93262eb4: keep tools/role-test.sh, role-test.yml, ansible.cfg and the Makefile ANSIBLE_GROUP lines.
      Also keep the ansible-top group in pyproject.toml and uv.lock.
      Drop release.yml, AGENTS.md, RELEASING.md, README.md and rename-namespace.sh.
      Move the lint-release.sh and tools/includes/lint-paths.sh hunks to L2.
      Upstream's requires_ansible floor stays at 2.12; the harness only reads the range in prose, so 0ac8e92's floor change is not needed here.
      818adcf7: drop the RELEASING.md hunk.
      It deletes four Molecule workflows (alloy, loki, mimir, opentelemetry-collector).
      Upstream's #545 modified them, so the cherry-pick stops on modify/delete.
      Resolve it by deleting them; that is 1a2e164's merge-only content.
      Take upstream's promtail-molecule.yml as it is, because R1 deletes it.
      f79318fb and 66165481: Makefile and galaxy.yml stop on context.
      Add only the role-test targets and the tests/roles build_ignore entry.
    requires: [P1]
    upstream:
      closes: []
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=loki DISTRO=debian

  - id: T2
    slug: module-test-harness
    group: harness
    epic: grafana-api-modules
    title: Module tests against a real Grafana, starting with datasource updates
    summary: |
      Grafana 13.0 removed PUT /api/datasources/:id, which is the route the datasource module used for every update.
      Each update then failed with a bare 404, and no test could have seen it, because nothing ran a module against a live Grafana.

      This chunk adds tools/module-test.sh and make module-test MODULE=<module>.
      It starts the Grafana version named in roles/grafana/defaults/main.yml, mints a token, and runs a scenario under tests/modules/<module>/.
      MODULE_TEST_GRAFANA_VERSION runs the same scenario against another Grafana, which is how the route's removal was dated to 13.0.

      The first scenario is the datasource fix itself, which ships here because the scenario is its test.
      The module now resolves the uid from GET /api/datasources by name.
      It updates through PUT /api/datasources/uid/:uid, which works on every Grafana from 10.4 to 13.2.
    commits:
      - "b4c0236b"
      - "2f99661b"
    seed_notes: |
      b4c0236b: drop the AGENTS.md, RELEASING.md and rename-namespace.sh hunks.
      Keep the Makefile module-test targets, the tests/modules build_ignore line, and the module-test group in pyproject.toml and uv.lock.
      Keep the lint-ansible.sh hunk too, which upstream's script can take.
    requires: [T1]
    upstream:
      closes: [537]
      carries: []
      supersedes: []
    tests:
      - module-test MODULE=datasource

  - id: T3
    slug: ansible-test-staging
    group: harness
    epic: cross-role
    title: ansible-test sanity and units, staged the way CI stages them
    summary: |
      ansible-test only runs inside ansible_collections/<namespace>/<name>, so a local run has to copy the tree first.
      Copying a different subset than CI gives a green local run against files CI does not have.

      This chunk adds make sanity and make units, both through tools/ansible-test.sh, which stages the collection from git's file list.
      It also fixes the module documentation that ansible-test sanity rejected, so the sanity run is green to begin with.
    commits:
      - "f16032b1"
      - "3a4630df"
      - "29a60ce3"
    seed_notes: |
      3a4630df: drop the AGENTS.md hunk.
      3a4630df and 29a60ce3 stop on Makefile context; add only the sanity and units targets.
    requires: [T2]
    upstream:
      closes: []
      carries: []
      supersedes: []
    tests:
      - sanity

  # ------------------------------------------------------- grafana role
  - id: G1
    slug: grafana-carried-fixes
    group: carried
    epic: grafana-install
    title: Three carried grafana role fixes for plugin install and the yum repository
    summary: |
      Three small upstream pull requests to the grafana role.
      #510 runs grafana-cli with chdir set to the Grafana home path, which plugin installs require.
      #534 rewrites the RHSM conditionals on the install tasks so they evaluate to booleans.
      #538 adds module_hotfixes to the yum repository, so yum and dnf do not prefer a system repository's grafana package over Grafana's own.

      The original pull requests are the cleanest way to take #534 and #538, because they keep each contributor's attribution and history.
      #510 was closed unmerged by its author, so this branch is its only remaining form.

      This chunk declares no tests.
      The grafana scenario installs a plugin through grafana-cli, which the pinned Grafana 13 no longer has, so it first passes on G3.
    commits:
      - "3ca217c8"
      - "97df8649"
      - "369a366f"
    seed_notes: |
      All three commits are contributor commits and go on whole.
      Add the grafana package-install retries from e53cfffb as a new commit by Ronny on top (see R1's notes).
    requires: [T1]
    upstream:
      closes: [533, 497]
      carries: [510, 534, 538]
      supersedes: [527]
    tests: []

  - id: G2
    slug: grafana-dashboards
    group: fixes
    epic: grafana-dashboards
    title: Dashboard provisioning that works on ansible-core 2.19 and is idempotent
    summary: |
      Dashboard provisioning had two faults.
      The removal of stale dashboards used conditionals that return a list instead of a boolean, which ansible-core 2.19 made fatal.
      The copy task set owner root while its own handler set owner grafana, so every run reported a change.

      This chunk makes the conditionals boolean and aligns the copy with the handler.
      It also adds an optional prepare phase to the role test, which seeds a stale dashboard once so the removal path is exercised at all.

      The folder loop is upstream's, as #439 fixed it, so this chunk does not change that line.

      This chunk declares no tests, for the same reason as G1: the grafana scenario first passes on G3, which installs plugins on Grafana 13.
      G3 runs the scenario on the newest ansible-core as well, which is the run that covers this chunk's 2.19 fix.
    commits:
      - "fdae4a80"
      - "f7e10b76"
    seed_notes: |
      f7e10b76 touches the loop line that upstream's #439 (ef0f489) changed.
      Merge b2b92c2 settled it: keep upstream's loop line and the boolean length checks on the removal task.
    requires: [G1]
    upstream:
      closes: [493, 244]
      carries: []
      supersedes: [504, 525]
    tests: []

  - id: G3
    slug: grafana-plugins-grafana-13
    group: fixes
    epic: grafana-install
    title: Plugin installation on Grafana 13
    summary: |
      Grafana 13 removed the grafana-cli binary, and the role installed plugins as root.
      It could also pass the CLI a plugin directory the server did not read.

      The role now probes for the grafana cli subcommand and falls back to grafana-cli, so every Grafana from 5.1 up keeps working.
      After the install, a recursive file task gives the plugin directory to the grafana user.
      That also repairs plugins an earlier run installed as root.
      grafana_ini.paths.plugins is derived from paths.data when unset.
      The directory the role creates, the CLI flag and the creates guard all read that one value.
    commits:
      - "64239f47"
    requires: [G2]
    upstream:
      closes: [331, 508, 509]
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=grafana DISTRO=debian
      - role-test ROLE=grafana DISTRO=rhel
      - role-test ROLE=grafana DISTRO=debian ANSIBLE_GROUP=ansible-top

  - id: G4
    slug: grafana-ini-booleans
    group: fixes
    epic: grafana-install
    title: grafana.ini booleans rendered lowercase
    summary: |
      A YAML true reached grafana.ini as True.
      Grafana accepts that in most places, but with auth.ldap enabled = True the server enables LDAP and the login page never shows it.

      The template now renders values Ansible typed as booleans through one macro, as true or false.
      Strings stay exactly as written, so quoting a value still works as an escape hatch.
      Five booleans in the role defaults change case, so the first converge on an existing host rewrites grafana.ini and restarts Grafana once.
    commits:
      - "04907082"
    requires: [G3]
    upstream:
      closes: [417]
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=grafana DISTRO=debian

  - id: G5
    slug: grafana-db-migration-wait
    group: carried
    epic: grafana-install
    title: Wait for database migrations before the role continues
    summary: |
      #528 adds a wait on /api/health so later tasks do not reach Grafana while it is still migrating its database.
      As submitted, the task cannot run: register, retries and delay sit inside the uri mapping, and the URL renders without ://.

      This chunk carries #528 unchanged and fixes it in a separate commit, then asserts in the role test that the database is ready after a converge.
      Merging #528 alone would give a task that stops the play, so the follow-up commit is needed either way.
    commits:
      - "33b66768"
      - "c6ccc910"
      - "af584d04"
    requires: [G4]
    upstream:
      closes: []
      carries: [528]
      supersedes: []
    tests:
      - role-test ROLE=grafana DISTRO=debian
      - role-test ROLE=grafana DISTRO=rhel

  - id: G6
    slug: grafana-server-probe
    group: fixes
    epic: grafana-install
    title: Readiness probes for IPv6, h2 and socket servers
    summary: |
      The role's two waits reused http_addr, a bind address, as their destination.
      A bracketed IPv6 address timed out after 300 seconds.
      With protocol h2 the start wait got no port and slept for its whole timeout, then reported success.
      socket_h2 got no socket directory and no preflight, and neither socket protocol got the migration wait.

      vars/main.yml now derives the probe target once for both waits: the address, the scheme, and whether to probe over TCP or the socket.
      A wildcard bind is probed on loopback, and socket_h2 requires root_url in a preflight.

      The role test gains named variants, so one scenario runs once per protocol and address form.
    commits:
      - "90c13c90"
      - "5d174f15"
      - "9ac5e078"
      - "d9472690"
      - "30cb4a48"
      - "b59fe61f"
      - "ac68ba0f"
      - "18f64485"
      - "3dc569d4"
      - "f9aab32b"
      - "57fff2b6"
      - "e65fd5b0"
      - "f35a5672"
    seed_notes: |
      b59fe61f: drop the lint-release.sh hunk, because lint-release.sh is not in this chunk's ancestry.
      L2 can take the variant check if both are taken.
      90c13c90: tools/role-test.sh stops on context from e3f02685, which lives in F3.
      Resolve by hand.
    requires: [G5]
    upstream:
      closes: [189]
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=grafana DISTRO=debian
      - role-test ROLE=grafana DISTRO=debian VARIANT=ipv6
      - role-test ROLE=grafana DISTRO=debian VARIANT=ipv6-bracketed
      - role-test ROLE=grafana DISTRO=debian VARIANT=h2
      - role-test ROLE=grafana DISTRO=debian VARIANT=socket
      - role-test ROLE=grafana DISTRO=debian VARIANT=socket-h2

  # ------------------------------------------------------ other carried
  - id: C1
    slug: otel-collector-ownership
    group: carried
    epic: otel-collector
    title: OpenTelemetry Collector binary owned by its service user
    summary: |
      The collector archive was extracted as root, so the binary stayed owned by root instead of the service user.
      #475 sets owner and group on the extraction.

      Merging #475 is the cleanest way to take this, because it keeps the contributor's attribution and history.
      The chunk holds only the carried commit, and the opentelemetry_collector role test asserts the ownership.
    commits:
      - "4f149e9a"
    requires: [T1]
    upstream:
      closes: []
      carries: [475]
      supersedes: []
    tests:
      - role-test ROLE=opentelemetry_collector DISTRO=debian
      - role-test ROLE=opentelemetry_collector DISTRO=rhel

  - id: C2
    slug: mimir-latest-version
    group: carried
    epic: mimir
    title: Mimir latest version resolution
    summary: |
      Mimir tags its releases mimir-<version>, so with mimir_version latest the role built a download URL that does not exist.
      #461 strips the prefix and accepts more than one tag format.

      Merging #461 is the cleanest way to take this, because it keeps the contributor's attribution and history.
      The chunk holds only the two carried commits, and the mimir role test runs against them.
    commits:
      - "d098f98c"
      - "9c46b446"
    requires: [T1]
    upstream:
      closes: [451]
      carries: [461]
      supersedes: []
    tests:
      - role-test ROLE=mimir DISTRO=debian

  - id: C3
    slug: alert-contact-point-update
    group: carried
    epic: grafana-api-modules
    title: alert_contact_point updates an existing contact point
    summary: |
      Grafana answers 409 when a contact point already exists, and the module treated that as a failure.
      So an existing contact point could not be updated.
      #536 handles 409 like the existing 500 path.

      A follow-up commit fixes the read-back in the same function.
      When the listing did not contain the uid, it returned None, which the caller unpacks into three values.
      It now returns the accepted body.
      Merging #536 upstream is the cleanest way to take the first part; the follow-up is on this branch only.
    commits:
      - "77bde107"
      - "aa63ddb9"
    requires: [T3]
    upstream:
      closes: [335]
      carries: [536]
      supersedes: []
    tests:
      - sanity

  # ------------------------------------------------------------- fixes
  - id: F1
    slug: loki-rpm-asset-name
    group: fixes
    epic: "-"
    title: Loki RPM installs on RHEL
    summary: |
      From Loki 3.7.5 on, the RPM asset name carries a release number, loki-<version>-1.<arch>.rpm.
      The role built the old name, so with loki_version latest every RHEL install got a 404.
      The .deb names did not change, which is why only RHEL broke.

      The role now picks the asset name by version, so pinning an older Loki still gets the old name.
    commits:
      - "88ce4103"
    seed_notes: |
      88ce4103: drop the AGENTS.md and RELEASING.md hunks.
    requires: [T1]
    upstream:
      closes: []
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=loki DISTRO=rhel

  - id: F2
    slug: tempo-3-defaults
    group: fixes
    epic: tempo
    title: Tempo defaults that Tempo 3.0 accepts
    summary: |
      Two of the role's defaults referred to things Tempo 3.0 removed: metrics_generator.traces_storage and the local-blocks processor.
      Tempo rejects the configuration and the service never starts.

      This chunk drops both defaults and adds a role test for tempo.
    commits:
      - "612152a5"
    seed_notes: |
      612152a5: drop the AGENTS.md and RELEASING.md hunks.
    requires: [T1]
    upstream:
      closes: []
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=tempo DISTRO=debian

  - id: F3
    slug: tempo-check-mode
    group: fixes
    epic: tempo
    title: Tempo dry run on a host without Tempo
    summary: |
      In check mode on a fresh host, the package install is only predicted, so tempo.service does not exist.
      The start task and the restart handler then failed.
      Both now skip in check mode when /usr/bin/tempo is absent, so a dry run on an installed host still reports drift.

      The role test gains a dry run with --check after prepare and before the first converge, for roles that opt in with a check.yml.
      That is the only phase that sees a host without the role's packages, which is where this failed.
    commits:
      - "263ec78d"
      - "e3f02685"
    seed_notes: |
      e3f02685: drop the AGENTS.md hunk.
      tools/role-test.sh stops on context from 90c13c90, which lives in G6.
      Resolve by hand.
    requires: [F2]
    upstream:
      closes: [406]
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=tempo DISTRO=debian

  - id: F4
    slug: latest-version-selection
    group: fixes
    epic: cross-role
    title: latest resolves to a release that is a version
    summary: |
      Five roles turned GitHub's releases/latest tag into a version with regex_replace.
      regex_replace returns its input unchanged when the pattern does not match.
      When alloy published a Go submodule tag, syntax/v0.1.1, as a release, the role requested a download URL built from it and got a 404.

      The alloy, loki, mimir, opentelemetry_collector and tempo roles now pick the newest release whose tag matches a version pattern.
      If none matches, they fail with the tags they saw.
      make version-select-test checks the selection against recorded GitHub payloads, with no network.
      So the test does not depend on what was published that day.
    commits:
      - "473b90d0"
      - "c62c1ba4"
      - "5b1e0930"
    seed_notes: |
      c62c1ba4: drop the gate.yml hunk, because gate.yml only exists in L2.
      The Makefile stops on context; add only the version-select-test target.
      5b1e0930: drop the RELEASING.md hunk.
    requires: [C2]
    upstream:
      closes: [530, 452]
      carries: []
      supersedes: []
    tests:
      - version-select-test

  - id: F5
    slug: alloy-config-validation
    group: fixes
    epic: alloy
    title: Alloy config validated, and the service checked after the restart
    summary: |
      The role reported success for a configuration Alloy cannot run.
      The configuration was never checked, and /-/ready answers 200 between two crashes of a service that systemd keeps restarting.

      The template task now runs alloy validate before the file replaces the old one, on Alloy 1.9.0 and later.
      After a restart, the role compares the unit's restart count across a short settle window, so a crash loop fails the play.
    commits:
      - "035aa36d"
    requires: [F4]
    upstream:
      closes: [535]
      carries: []
      supersedes: []
    tests:
      - role-test ROLE=alloy DISTRO=debian
      - role-test ROLE=alloy DISTRO=rhel

  - id: F6
    slug: mimir-config-variables
    group: fixes
    epic: mimir
    title: Mimir target, config mode and extra top-level keys as variables
    summary: |
      Several values in the mimir role were literals with no variable: the -target flag, the config file mode, and the retries on the readiness wait.
      Top-level config keys without a mimir_<section> variable could not be set at all.

