  - id: F7
    slug: cloud-plugin-requests
    group: fixes
    epic: grafana-api-modules
    title: cloud_plugin authenticates, reports refusals and stays idempotent
    summary: |
      cloud_plugin built its Authorization header for state=present from a parameter the module never declares.
      So every create and update raised KeyError.
      Refusals raised KeyError or a decode error instead of reporting the HTTP status.
      With version latest, it compared the installed version with the string latest, so it reported changed on every run.

      The module now authenticates with cloud_api_key and fails with the status and body of a refusal.
      It accepts any 2xx, and compares against the latestVersion the lookup returns.
      grafana.com cannot run in a container, so the module's HTTP calls are mocked in unit tests under tests/unit.
    commits:
