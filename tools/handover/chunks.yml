  # ------------------------------------------------------------- pinning
  - id: P1
    slug: role-version-pins
    group: pinning
    epic: cross-role
    title: Every role pins its version, and a weekly check moves the pins
    summary: |
      Six roles resolved <role>_version latest at run time, so what they installed changed whenever upstream published.
      opentelemetry_collector sat at 0.90.1 from 2023 because nothing asked anyone to move it.

      Each role now defaults to a concrete version.
      tools/check-role-versions.py compares each pin with the source its role installs from.
      That is the release assets for five roles, and the apt and rpm indexes for grafana.
      A weekly workflow opens a bump pull request when a pin falls behind.
      make ci-lint-versions checks that the READMEs state the pinned versions.
      The bump commits since then are included, so the pins are current.

      This chunk sits under the harness, so every tested chunk runs on the same pinned versions instead of whatever latest was that day.
