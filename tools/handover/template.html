<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Upstream handover</title>
<style>
:root {
  color-scheme: light;
  --bg: #fbfbfa;
  --surface: #ffffff;
  --text: #1f2328;
  --muted: #59636e;
  --border: #d8dee4;
  --link: #0b5cad;
  --code-bg: #f3f4f6;
  --accent: #0b5cad;
  --ok-fg: #116329;
  --ok-bg: #e6f4ea;
  --warn-fg: #7a4a00;
  --warn-bg: #fff4d6;
  --info-fg: #3b3f99;
  --info-bg: #ebecfb;
  --plain-fg: #4a525b;
  --plain-bg: #eef0f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111418;
    --surface: #171b21;
    --text: #e3e7ec;
    --muted: #9aa4af;
    --border: #2e353e;
    --link: #79b8ff;
    --code-bg: #1f252d;
    --accent: #79b8ff;
    --ok-fg: #8fdca6;
    --ok-bg: #14301f;
    --warn-fg: #f2c46b;
    --warn-bg: #352a10;
    --info-fg: #b3b8ff;
    --info-bg: #23264a;
    --plain-fg: #b7c0ca;
    --plain-bg: #232a32;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main {
  max-width: 48rem;
  margin: 0 auto;
  padding: 2rem 1rem 4rem;
}
a { color: var(--link); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.1em 0.3em; border-radius: 4px; overflow-wrap: anywhere; }
pre { margin: 0.75rem 0; }
pre code { display: block; padding: 0.6rem 0.75rem; overflow-x: auto; white-space: pre; overflow-wrap: normal; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.25rem; }
h2 { font-size: 1.3rem; margin: 2.25rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.1rem; line-height: 1.35; margin: 0.15rem 0 0.4rem; }
.lede { color: var(--muted); margin: 0; }
.stamp { color: var(--muted); font-size: 0.9rem; margin: 0.25rem 0 0; }
.fork-only li, #intro li { margin: 0.25rem 0; }
#intro > details { border-top: 1px solid var(--border); padding: 0.4rem 0; margin: 0; }
#intro > details:last-child { border-bottom: 1px solid var(--border); }
#intro > details > summary { font-weight: 600; }
.groups { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.groups li { border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.75rem; background: var(--surface); }
.groups .count { color: var(--muted); margin-left: 0.25rem; }
.warn { color: var(--warn-fg); background: var(--warn-bg); padding: 0.4rem 0.6rem; border-radius: 6px; }
.group > h2 { margin-top: 3rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.1rem;
  margin: 1rem 0;
}
.card[data-status="verified"] { border-left-color: var(--ok-fg); }
.card[data-status="behind"] { border-left-color: var(--warn-fg); }
.card[data-status="landed"] { border-left-color: var(--info-fg); }
.chunk { margin: 0; }
.chunk > summary {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  color: var(--text);
  list-style: none;
}
.chunk > summary::-webkit-details-marker { display: none; }
.chunk > summary::before { content: "\25B8"; color: var(--muted); }
.chunk[open] > summary::before { content: "\25BE"; }
.chunk > summary h3 { flex: 1; margin: 0; }
.cid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); font-size: 0.9rem; min-width: 2.2rem; }
.pill { white-space: nowrap; font-size: 0.8rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; }
.pill-verified { color: var(--ok-fg); background: var(--ok-bg); }
.pill-behind { color: var(--warn-fg); background: var(--warn-bg); }
.pill-landed { color: var(--info-fg); background: var(--info-bg); }
.pill-untested { color: var(--plain-fg); background: var(--plain-bg); }
.body { padding-top: 0.6rem; }
.body .meta { margin: 0 0 0.4rem; color: var(--muted); font-size: 0.85rem; }
.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
.status-filter { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.filters button, .filters input {
  font: inherit;
  font-size: 0.9rem;
  padding: 0.25rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
}
.filters button { cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.filters .count { color: var(--muted); }
.filters input { flex: 1 1 14rem; min-width: 0; }
.shown { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin: 0; }
.status {
  display: inline-block;
  margin: 0 0 0.5rem;
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.92rem;
}
.status-verified { color: var(--ok-fg); background: var(--ok-bg); }
.status-behind { color: var(--warn-fg); background: var(--warn-bg); }
.status-landed { color: var(--info-fg); background: var(--info-bg); }
.status-untested { color: var(--plain-fg); background: var(--plain-bg); }
.status-detail { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.note { border-left: 3px solid var(--accent); padding-left: 0.75rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; margin: 0.75rem 0; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; }
.cla { color: var(--muted); font-size: 0.85em; }
.cla-success { color: var(--ok-fg); }
.cla-failure, .cla-pending, .cla-error, .cla-unknown { color: var(--warn-fg); }
details { margin: 0.5rem 0; }
summary { cursor: pointer; color: var(--link); }
.commits, .files { padding-left: 1.25rem; font-size: 0.92rem; }
.commits li, .files li { overflow-wrap: anywhere; }
.author { color: var(--muted); }
.files { columns: 2 18rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; }
td:first-child { white-space: nowrap; }
@media (max-width: 30rem) {
  main { padding-top: 1.25rem; }
  h1 { font-size: 1.5rem; }
  .card { padding: 0.85rem; }
  .chunk > summary { flex-wrap: wrap; }
  dl { grid-template-columns: 1fr; }
  dd { margin-bottom: 0.35rem; }
}
</style>
</head>
<body>
<main>
<header>
<h1>Upstream handover</h1>
<p class="lede">Work from no42-org/grafana-ansible-collection, offered back to grafana/grafana-ansible-collection in chunks.</p>
<p class="stamp">${generated}</p>
</header>
${intro}
${overview}
${groups}
${appendix}
</main>
<script>
(function () {
  "use strict";
  var cards = Array.prototype.slice.call(document.querySelectorAll("[data-chunk]"));
  var groups = Array.prototype.slice.call(document.querySelectorAll(".group"));
  var filters = document.querySelector(".filters");
  var buttons = Array.prototype.slice.call(filters.querySelectorAll("button[data-status]"));
  var search = document.getElementById("search");
  var expand = document.getElementById("expand");
  var shown = document.getElementById("shown");
  var wanted = "";
  function visible() {
    return cards.filter(function (card) { return !card.hidden; });
  }
  function apply() {
    var query = search.value.trim().toLowerCase();
    cards.forEach(function (card) {
      var status = !wanted || card.getAttribute("data-status") === wanted;
      var text = !query || card.textContent.toLowerCase().indexOf(query) !== -1;
      card.hidden = !(status && text);
    });
    groups.forEach(function (group) {
      group.hidden = !group.querySelector("[data-chunk]:not([hidden])");
    });
    var n = visible().length;
    shown.textContent = n === cards.length ? "" : "Showing " + n + " of " + cards.length + " chunks.";
  }
  buttons.forEach(function (button) {
    button.addEventListener("click", function () {
      wanted = button.getAttribute("data-status");
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b === button ? "true" : "false"); });
      apply();
    });
  });
  search.addEventListener("input", apply);
  expand.addEventListener("click", function () {
    var all = visible().map(function (card) { return card.querySelector("details"); });
    var open = all.some(function (d) { return !d.open; });
    all.forEach(function (d) { d.open = open; });
    expand.textContent = open ? "collapse all" : "expand all";
  });
  // A link to #card-X opens that card, clearing any filter that hides it.
  function reveal() {
    var id = decodeURIComponent(location.hash.slice(1));
    var card = id.indexOf("card-") === 0 ? document.getElementById(id) : null;
    if (!card) { return; }
    if (card.hidden) {
      wanted = "";
      search.value = "";
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-status") === "" ? "true" : "false"); });
      apply();
    }
    card.querySelector("details").open = true;
    card.scrollIntoView();
  }
  window.addEventListener("hashchange", reveal);
  filters.hidden = false;
  reveal();
})();
</script>
</body>
</html>
