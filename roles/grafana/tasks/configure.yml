---
- name: "Ensure grafana directories exist"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('grafana') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "/etc/grafana"
    - path: "/etc/grafana/datasources"
    - path: "/etc/grafana/provisioning"
    - path: "/etc/grafana/provisioning/datasources"
    - path: "/etc/grafana/provisioning/dashboards"
    - path: "/etc/grafana/provisioning/notifiers"
    - path: "/etc/grafana/provisioning/notification"
    - path: "/etc/grafana/provisioning/plugins"
    - path: "/etc/grafana/provisioning/alerting"
    - path: "{{ grafana_ini.paths.logs }}"
      owner: grafana
    - path: "{{ grafana_ini.paths.data }}"
      owner: grafana
    - path: "{{ grafana_ini.paths.data }}/dashboards"
      owner: grafana
    - path: "{{ grafana_ini.paths.plugins }}"
      owner: grafana

- name: "Create grafana main configuration file"
  ansible.builtin.template:
    src: "grafana.ini.j2"
    dest: "/etc/grafana/grafana.ini"
    owner: "root"
    group: "grafana"
    mode: "0640"
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"
  notify: restart_grafana

- name: "Create grafana LDAP configuration file"
  ansible.builtin.template:
    src: "ldap.toml.j2"
    dest: "{{ grafana_ini.auth.ldap.config_file | default('/etc/grafana/ldap.toml') }}"
    owner: "root"
    group: "grafana"
    mode: "0640"
  no_log: "{{ 'false' if lookup('env', 'CI') else 'true' }}"
  notify: restart_grafana
  when:
    - "'ldap' in grafana_ini.auth"
    - "'enabled' not in grafana_ini.auth.ldap or grafana_ini.auth.ldap.enabled"

# /run/grafana belongs to systemd: the packaged grafana-server.service, deb and
# rpm alike, declares RuntimeDirectory=grafana with RuntimeDirectoryMode=0750
# and recreates it on every start. Managing it here as well set it to 0775,
# which the next restart undid, so the role never converged (#157). A socket
# directly in /run or /var/run is refused by the preflight.
- name: "Enable grafana socket"
  when:
    - __grafana_on_socket | bool
    - not __grafana_socket_dir_is_runtime_dir | bool
  block:
    - name: "Create grafana socket directory"
      ansible.builtin.file:
        path: "{{ grafana_ini.server.socket | dirname }}"
        state: "directory"
        mode: "0775"
        owner: "grafana"
        group: "grafana"

    - name: "Ensure grafana socket directory created on startup"
      ansible.builtin.template:
        src: "tmpfiles.j2"
        dest: "/etc/tmpfiles.d/grafana.conf"
        owner: "root"
        group: "root"
        mode: "0644"

# An earlier version of this role wrote that entry for /run/grafana too, so a
# host it configured would recreate the directory as 0775 at every boot, and
# systemd would set it back to 0750 at the next start.
- name: "Remove the socket tmpfiles entry the systemd runtime directory makes redundant"
  ansible.builtin.file:
    path: /etc/tmpfiles.d/grafana.conf
    state: absent
  when:
    - __grafana_on_socket | bool
    - __grafana_socket_dir_is_runtime_dir | bool

- name: "Enable grafana to ports lower than port 1024"
  community.general.capabilities:
    path: /usr/sbin/grafana-server
    capability: CAP_NET_BIND_SERVICE+ep
    state: present
  when:
    - "grafana_ini.server.http_port | int <= 1024"
    - "grafana_cap_net_bind_service"

- name: Create a directory for overrides.conf unit file if it does not exist
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: '0755'
  when:
    - "grafana_ini.server.http_port | int <= 1024"
    - "grafana_cap_net_bind_service"

- name: "Enable grafana to ports lower than port 1024 in systemd unitfile"
  ansible.builtin.blockinfile:
    path: /etc/systemd/system/grafana-server.service.d/overrides.conf
    create: true
    mode: '0644'
    block: |
      [Service]
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
  when:
    - "grafana_ini.server.http_port | int <= 1024"
    - "grafana_cap_net_bind_service"

- name: "Enable and start Grafana systemd unit"
  ansible.builtin.systemd:
    name: "grafana-server"
    enabled: true
    state: started
    daemon_reload: true

# The wait belongs here, between starting the service and main.yml's
# flush_handlers. The role's other wait, "Wait for grafana to start", is a TCP
# wait_for that runs after the flush: the socket opens long before the
# migrations finish, and by then the restart has already landed.
#
# http_addr is a bind address, not somewhere to send a request. The probe
# never leaves the host, so it connects to __grafana_probe_url_host from
# vars/main.yml: loopback for a wildcard bind, bracketed for an IPv6 address.
# On a socket protocol it goes through the socket instead; the URL then only
# supplies the scheme and the path (#157).
# validate_certs is off because a certificate issued for this server's name
# cannot match a loopback address, which would fail the check on every
# correctly configured https deployment.
#
# The default() in `until` is what makes the retry loop a retry loop. The
# first attempt usually reaches a port that is not listening yet, the module
# fails with no `json` in its result, and an unguarded grafana_health.json
# raises on undefined instead of retrying.
- name: Wait for DB migrations to complete
  ansible.builtin.uri:
    url: "{{ __grafana_probe_scheme }}://{{ 'localhost' if __grafana_probe_socket | bool else __grafana_probe_url_host ~ ':' ~ grafana_ini.server.http_port }}/api/health"
    unix_socket: "{{ grafana_ini.server.socket if __grafana_probe_socket | bool else omit }}"
    follow_redirects: none
    validate_certs: false
  register: grafana_health
  retries: 10
  delay: 5
  until: grafana_health.json.database | default('') == 'ok'
  when:
    - __grafana_probe_tcp | bool or __grafana_probe_socket | bool
