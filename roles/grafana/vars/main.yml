---
# Where the role's own probes connect, derived once from the bind address.
#
# grafana_ini.server.http_addr is a bind address, and the consumer has to write
# it in whichever IPv6 form their Grafana accepts: 10.3 to 11.0 start only on
# "[::1]", 11.6 and later only on "::1". So the probes cannot use the value as
# given. "Wait for grafana to start" needs a bare host for its socket, and
# "Wait for DB migrations to complete" needs a bracketed one inside its URL.
#
# A wildcard bind is not a destination, so "0.0.0.0", "" and "::" become
# 127.0.0.1. Not ::1 for "::": on a host with IPv6 disabled, Go's listener
# falls back to 0.0.0.0 and ::1 does not exist. 127.0.0.1 misses only on a
# kernel with bindv6only=1, which no mainstream distribution sets by default.
#
# grafana.ini still gets http_addr exactly as the consumer wrote it.
__grafana_probe_bind: "{{ grafana_ini.server.http_addr | default('') | regex_replace('^\\[(.*)\\]$', '\\1') }}"
__grafana_probe_host: >-
  {{ '127.0.0.1' if __grafana_probe_bind in ['', '0.0.0.0', '::']
  else __grafana_probe_bind }}
__grafana_probe_url_host: "{{ '[' ~ __grafana_probe_host ~ ']' if ':' in __grafana_probe_host else __grafana_probe_host }}"

# How the probes reach the server, decided once for both waits from the
# protocol. Grafana defines five: http, https, h2, socket and socket_h2.
#
# h2 is probed exactly as https. Measured on 13.2.4: in h2 mode Grafana
# answers /api/health over HTTP/1.1 as well as HTTP/2, so ansible.builtin.uri,
# which speaks only HTTP/1.1, needs nothing more. Any other protocol that is not
# a socket is probed as http, because that is what Grafana serves: given an
# unknown value such as "gopher", 13.2.4 logs nothing and listens with
# protocol=http.
#
# The socket protocols are probed by their path, and only when one is set. A
# wait_for given neither a port nor a path sleeps for its timeout and reports
# success, which is what h2 did before (#151); an empty socket path would do
# the same.
__grafana_probe_protocol: "{{ grafana_ini.server.protocol | default('http') }}"
__grafana_on_socket: "{{ __grafana_probe_protocol in ['socket', 'socket_h2'] }}"
__grafana_probe_tcp: "{{ not __grafana_on_socket | bool }}"
__grafana_probe_socket: "{{ __grafana_on_socket | bool and grafana_ini.server.socket | default('') | length > 0 }}"

# Whether the socket's directory is /run/grafana, which the packaged
# grafana-server.service owns (RuntimeDirectory=grafana, deb and rpm alike).
# A pattern rather than a list of strings, so "/run/grafana/" or
# "/run/grafana//grafana.sock" cannot slip past it.
__grafana_socket_dir_is_runtime_dir: "{{ grafana_ini.server.socket | default('') | dirname is match('^/(var/)?run/grafana/*$') }}"
# socket_h2 speaks TLS on its socket: measured on 13.2.4, a plain request gets
# "Client sent an HTTP request to an HTTPS server" (#157).
__grafana_probe_scheme: "{{ 'https' if __grafana_probe_protocol in ['https', 'h2', 'socket_h2'] else 'http' }}"
