---
# tasks file for promtail deploy

- name: Warn that promtail is end of life
  ansible.builtin.debug:
    msg: >-
      promtail reached end of life on 2026-03-02. Grafana has ended support,
      publishes no packages after Loki 3.6.0, and directs users to Grafana
      Alloy; this collection ships a tested `alloy` role. This role installs
      promtail {{ promtail_version }}, and 3.6.0 is the last version with
      published packages -- there will be no further releases or security
      updates.
  run_once: true

# promtail_clients is mandatory -- the role's README says so, and the default
# is deliberately empty because there is no sensible universal answer to "where
# do the logs go". But an empty list produced a config promtail rejects at
# startup ("failed to create client manager: at least one client config must be
# provided"), and the role still reported "Ensure that Promtail is started: ok",
# leaving a unit that crash-loops on a five-second timer. Say it instead.
- name: Assert that promtail_clients is set
  ansible.builtin.assert:
    that:
      - promtail_clients | length > 0
    fail_msg: >-
      promtail_clients is mandatory and is empty. promtail refuses to start
      without at least one client, for example:
      promtail_clients: [{ url: "http://localhost:3100/loki/api/v1/push" }]
    success_msg: "promtail_clients has {{ promtail_clients | length }} client(s)"
  run_once: true

- name: Obtain the latest version from the GitHub repo
  when: promtail_version == "latest"
  block:
    - name: Scrape Github API endpoint to obtain latest Promtail version
      ansible.builtin.uri:
        url: "https://api.github.com/repos/grafana/loki/releases/latest"
        method: GET
        body_format: json
      become: false
      delegate_to: localhost
      run_once: true
      check_mode: false
      register: __github_latest_version

    - name: Latest available Promtail version
      ansible.builtin.set_fact:
        promtail_version: "{{ __github_latest_version.json.tag_name | regex_replace('^v?(\\d+\\.\\d+\\.\\d+)$', '\\1') }}"

# Outside the resolution block on purpose. A block's `when` is re-evaluated for
# every task inside it, so a guard placed in there would test
# `promtail_version == "latest"` again -- after the set_fact above changed it --
# and skip itself. Out here it also catches someone pinning 3.7.0 directly,
# which the download would otherwise answer with a bare 404.
- name: Fail if the version has no promtail packages
  ansible.builtin.fail:
    msg: >-
      promtail_version is {{ promtail_version }}, and Grafana published no
      promtail packages after Loki 3.6.0 -- v3.6.0 has 14 promtail assets,
      v3.7.0 has none. Set promtail_version to 3.6.0 or older, or migrate to
      the `alloy` role in this collection.
  when: promtail_version is version('3.6.0', '>')
  run_once: true

- name: Verify current deployed version
  block:
    - name: Check if Promtail binary is present
      ansible.builtin.stat:
        path: "/usr/bin/promtail"
      register: __already_deployed

    - name: Obtain current deployed Promtail version
      ansible.builtin.command:
        cmd: "/usr/bin/promtail --version"
      changed_when: false
      register: __current_deployed_version
      when: __already_deployed.stat.exists | bool

- name: Include RedHat/Rocky setup
  ansible.builtin.include_tasks:
    file: setup-RedHat.yml
  when: ansible_facts['os_family'] in ['RedHat', 'Rocky']

- name: Include Debian/Ubuntu setup
  ansible.builtin.include_tasks:
    file: setup-Debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure that Promtail position path exists
  ansible.builtin.file:
    path: "{{ promtail_positions_path }}"
    state: directory
    owner: "promtail"
    group: "root"
    mode: "0750"
  notify: restart promtail

- name: Template Promtail config - /etc/promtail/config.yml
  ansible.builtin.template:
    src: "config.yml.j2"
    dest: "/etc/promtail/config.yml"
    owner: "promtail"
    group: "root"
    mode: "0644"
    validate: "/usr/bin/promtail -config.expand-env=true -check-syntax -config.file %s"
  notify: restart promtail

- name: Template Promtail systemd - /etc/systemd/system/promtail.service
  ansible.builtin.template:
    src: "promtail.service.j2"
    dest: "/etc/systemd/system/promtail.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: restart promtail

- name: Add the Promtail system user to additional group
  ansible.builtin.user:
    name: "promtail"
    groups: "{{ item }}"
    system: true
    append: true
    create_home: false
    state: present
  loop: "{{ promtail_user_append_groups }}"
  when:
    - promtail_user_append_groups | length > 0
    - promtail_runtime_mode == "acl"

- name: Include Promtail ACL permission configuration
  ansible.builtin.include_tasks:
    file: "acl_configuration.yml"
  when:
    - promtail_scrape_configs | length > 0
    - promtail_runtime_mode == "acl"
    - not ansible_check_mode

- name: Get firewalld state
  ansible.builtin.systemd:
    name: "firewalld"
  register: __firewalld_service_state

- name: Enable firewalld rule to expose Promtail tcp port {{ promtail_http_listen_port }}
  ansible.posix.firewalld:
    immediate: true
    permanent: true
    port: "{{ promtail_http_listen_port }}/tcp"
    state: enabled
  when:
    - __firewalld_service_state.status.ActiveState == "active"
    - promtail_expose_port | bool

- name: Flush handlers after deployment
  ansible.builtin.meta: flush_handlers

- name: Ensure that Promtail is started
  ansible.builtin.systemd:
    name: promtail.service
    state: started
  when: not ansible_check_mode

- name: Stat position file
  ansible.builtin.stat:
    path: "{{ promtail_positions_path }}/positions.yaml"
  register: __promtail_stat_position_file

- name: Ensure correct owner and group for Promtail position file
  ansible.builtin.file:
    path: "{{ promtail_positions_path }}/positions.yaml"
    state: file
    owner: "promtail"
  notify: restart promtail
  when:
    - __promtail_stat_position_file.stat.exists
    - promtail_runtime_mode == "acl"

- name: Verify that Promtail URL is responding
  ansible.builtin.uri:
    url: "http://{{ promtail_http_listen_address }}:{{ promtail_http_listen_port }}/ready"
    method: GET
  register: promtail_verify_url_status_code
  retries: 5
  delay: 8
  until: promtail_verify_url_status_code.status == 200
  when:
    - promtail_expose_port | bool
    - not ansible_check_mode
