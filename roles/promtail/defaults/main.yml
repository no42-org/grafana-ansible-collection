---
# defaults file for promtail
# Pinned, not "latest".
#
# Grafana declared promtail end of life on 2026-03-02 and stopped publishing
# packages after Loki 3.6.0: v3.6.0 carries 14 promtail assets, v3.7.0 carries
# none. So `latest` resolves to a release with nothing to download and every
# install 404s, on both package families.
#
# 3.6.0 is the last release that has them, and it is not going to move -- there
# will be no promtail 3.7. Pinning is therefore not a temporary workaround; it
# is the final version. All further development is in Grafana Alloy, and this
# collection ships a tested `alloy` role.
#
# Overriding this with an older version still works. Overriding it with
# anything from 3.7.0 on cannot.
#
# Deliberately excluded from tools/check-role-versions.py: every other role's
# pin is watched for going stale, and this one cannot, because nothing newer
# will ever exist.
promtail_version: "3.6.0"
promtail_uninstall: false
promtail_http_listen_port: 9080
promtail_http_listen_address: "0.0.0.0"
promtail_expose_port: false
promtail_positions_path: "/var/lib/promtail"
promtail_runtime_mode: "acl"  # Supported "root" or "acl"
promtail_extra_flags: []
# promtail_extra_flags:
#   - "-server.enable-runtime-reload"
#   - "-config.expand-env=true"

promtail_user_append_groups:
  - "systemd-journal"

promtail_download_url_rpm: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-{{ promtail_version }}.{{ __promtail_arch }}.rpm"
promtail_download_url_deb: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail_{{ promtail_version }}_{{ __promtail_arch }}.deb"

# default variables for /etc/promtail/config.yml
promtail_server:
  http_listen_port: "{{ promtail_http_listen_port }}"
  http_listen_address: "{{ promtail_http_listen_address }}"

promtail_positions:
  filename: "{{ promtail_positions_path }}/positions.yaml"

promtail_clients: []
# promtail_clients:
#   - url: http://localhost:3100/loki/api/v1/push

promtail_scrape_configs: []
