---
# defaults file for mimir
# Pinned, not `latest`. A floating label makes this role's behaviour change
# when nobody changed this repository, and makes a passing role test undurable:
# it proved whichever release happened to be current that day, and nothing
# recorded which. tools/check-role-versions.py watches this pin and opens a
# pull request when grafana/mimir releases something newer; the bump is then verified
# by the role tests on both package families before it can merge.
mimir_version: "3.2.1"
mimir_uninstall: false
__mimir_arch: "{{ arch_mapping[ansible_facts['architecture']] | default('amd64') }}"
mimir_download_url_rpm: "https://github.com/grafana/mimir/releases/download/mimir-{{ mimir_version }}/mimir-{{ mimir_version }}_{{ __mimir_arch }}.rpm"
mimir_download_url_deb: "https://github.com/grafana/mimir/releases/download/mimir-{{ mimir_version }}/mimir-{{ mimir_version }}_{{ __mimir_arch }}.deb"
mimir_working_path: "/var/lib/mimir"
mimir_ruler_alert_path: "{{ mimir_working_path }}/ruler"
mimir_http_listen_port: 8080
mimir_http_listen_address: "0.0.0.0"

# Top-level keys for /etc/mimir/config.yml that the template has no named
# section for (multitenancy_enabled, store_gateway, compactor, frontend, ...).
# Rendered verbatim after the named sections. A key that also has a named
# section (server, limits, ingester, ...) is refused: YAML parsers accept a
# duplicated top-level key and Mimir would read whichever survived parsing.
mimir_config_extra: {}

# Which modules the single process runs. The default is what the template
# always wrote. `all` alone leaves the alertmanager and overrides-exporter
# modules off, which a consumer that never calls them may prefer, since the
# alertmanager module also initialises the memberlist KV service and needs
# its storage backend reachable.
mimir_target: "all,alertmanager,overrides-exporter"

# Mode of /etc/mimir/config.yml. The file carries object-store credentials
# when an S3 backend is configured; 0640 keeps it to the mimir user and group.
mimir_config_mode: "0644"

# How long the role waits for /ready after starting the service. The defaults
# are what the role always did; a clustered node that has to join memberlist
# before its ingester reports ready may need more.
mimir_ready_retries: 5
mimir_ready_delay: 8

arch_mapping:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
  i386: i386
  ppc64le: ppc64le

mimir_server:
  http_listen_port: "{{ mimir_http_listen_port }}"
  http_listen_address: "{{ mimir_http_listen_address }}"

mimir_ruler:
  rule_path: "{{ mimir_working_path }}/ruler"
  alertmanager_url: "http://localhost:{{ mimir_http_listen_port }}/alertmanager"

mimir_alertmanager:
  data_dir: "{{ mimir_working_path }}/alertmanager"
  external_url: "http://localhost:{{ mimir_http_listen_port }}/alertmanager"
