---
# defaults file for tempo
# Pinned, not `latest`. A floating label makes this role's behaviour change
# when nobody changed this repository, and makes a passing role test undurable:
# it proved whichever release happened to be current that day, and nothing
# recorded which. tools/check-role-versions.py watches this pin and opens a
# pull request when grafana/tempo releases something newer; the bump is then verified
# by the role tests on both package families before it can merge.
tempo_version: "3.0.3"
tempo_uninstall: false
__tempo_arch: "{{ arch_mapping[ansible_facts['architecture']] | default('amd64') }}"
tempo_download_url_rpm: "https://github.com/grafana/tempo/releases/download/v{{ tempo_version }}/tempo_{{ tempo_version }}_linux_{{ __tempo_arch }}.rpm"
tempo_download_url_deb: "https://github.com/grafana/tempo/releases/download/v{{ tempo_version }}/tempo_{{ tempo_version }}_linux_{{ __tempo_arch }}.deb"
tempo_working_path: "/var/lib/tempo"
tempo_http_listen_port: 3200
tempo_http_listen_address: "0.0.0.0"
tempo_log_level: warn
tempo_report_usage: true
tempo_multitenancy_enabled: false

# Default Variables from /etc/tempo/config.yml
tempo_server:
  http_listen_port: "{{ tempo_http_listen_port }}"
  http_listen_address: "{{ tempo_http_listen_address }}"
  log_level: "{{ tempo_log_level }}"

tempo_query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
    metadata_slo:
      duration_slo: 5s
      throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

tempo_distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "{{ tempo_http_listen_address }}:4317"

# `traces_storage` is gone. It configured the local-blocks processor's trace
# storage, and Tempo 3.0 removed that processor and all of its local block
# plumbing (grafana/tempo#6555); the live-store fills the role now. Tempo
# rejects the key outright -- `field traces_storage not found in type
# generator.Config` -- so it refused to start on the defaults this role
# shipped.
#
# `cluster: docker-compose` is upstream's label from the Tempo docker-compose
# example. It is wrong for a host install but harmless, and changing a label
# users may already be scraping on is not this fix's business.
tempo_metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: "{{ tempo_working_path }}/generator/wal"
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

tempo_storage:
  trace:
    backend: local                     # backend configuration to use
    wal:
      path: "{{ tempo_working_path }}/wal"             # where to store the wal locally
    local:
      path: "{{ tempo_working_path }}/blocks"

# `local-blocks` is removed from this list for the same reason: Tempo 3.0
# deleted the processor, and its own upgrade notes call referencing it a
# breaking change. The valid processors are service-graphs, span-metrics and
# host-info.
tempo_overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics] # enables metrics generator
      generate_native_histograms: both

