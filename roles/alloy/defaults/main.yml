---
# defaults file for alloy
# Pinned, not `latest`. A floating label makes this role's behaviour change
# when nobody changed this repository, and makes a passing role test undurable:
# it proved whichever release happened to be current that day, and nothing
# recorded which. tools/check-role-versions.py watches this pin and opens a
# pull request when grafana/alloy releases something newer; the bump is then verified
# by the role tests on both package families before it can merge.
alloy_version: "1.19.2"
alloy_uninstall: false
alloy_expose_port: false
# The releases list, not releases/latest. Alloy publishes Go submodule tags as
# full releases -- 'syntax/v0.1.1' was the newest one when upstream issue #530
# was reported -- so the newest release is not reliably a version of Alloy. The
# role picks the newest whose tag is one. A releases/latest URL set here still
# works; it just leaves one candidate to choose from.
alloy_github_api_url: "https://api.github.com/repos/grafana/alloy/releases?per_page=30"
alloy_download_url_rpm: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-{{ alloy_version }}-1.{{ __alloy_arch }}.rpm"
alloy_download_url_deb: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-{{ alloy_version }}-1.{{ __alloy_arch }}.deb"
alloy_readiness_check_use_https: false
alloy_readiness_check_use_proxy: true

# Run `alloy validate` over the configuration before it reaches disk.
#
# The readiness check alone cannot reject a broken configuration: Ansible's
# `retries` only apply after a failed attempt, so a first-try 200 from /-/ready
# ends the task, and /-/ready answers 200 from a process systemd is respawning.
# Validation is skipped, not failed, when alloy_version predates 1.9.0 or the
# binary is not on the host yet. Set false to turn it off entirely.
alloy_validate_config: true
# Extra flags for `alloy validate`, appended to the ones derived from
# alloy_env_file_vars.CUSTOM_ARGS. For a configuration that is not in Alloy
# syntax, or a flag this role does not know about, for example:
#   alloy_validate_extra_args: "--config.format=otelcol"
alloy_validate_extra_args: ""
# How long to hold after /-/ready answers before confirming the service is
# still up, in seconds. The packaged unit is Restart=always with the default
# RestartSec of 100ms, so a configuration that loads and then crashes is
# respawned about ten times a second and still answers /-/ready. The window is
# what gives that crash time to happen. Only applies when this run actually
# restarted Alloy; set 0 to skip the confirmation.
alloy_restart_settle_seconds: 10

alloy_user_groups: []
# alloy_user_groups:
#   - "systemd-journal"

alloy_env_file_vars: {}
# alloy_env_file_vars:
#   CONFIG_FILE: "/custom/path"
#   CUSTOM_ARGS: "--server.http.listen-addr=0.0.0.0:12345 --stability.level=public-preview --feature.community-components.enabled=true"

alloy_systemd_override: {}
# alloy_systemd_override: |
#   [Service]
#   User=root

alloy_config: {}
