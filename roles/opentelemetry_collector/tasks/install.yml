- name: Discover latest OpenTelemetry Collector version
  when: otel_collector_version == 'latest'
  vars:
    # The releases endpoint returns a list. A consumer who has overridden it
    # with a releases/latest URL gets a single object, which is wrapped here so
    # both shapes go through the same filter.
    __otel_collector_releases: >-
      {{ __github_latest_version.json
      if __github_latest_version.json is sequence
      and __github_latest_version.json is not mapping
      else [__github_latest_version.json] }}
  block:
    - name: Scrape Github API endpoint to obtain latest OpenTelemetry Collector version
      ansible.builtin.uri:
        url: "{{ otel_collector_latest_url }}"
        method: GET
        body_format: json
      become: false
      delegate_to: localhost
      run_once: true
      check_mode: false
      register: __github_latest_version

    # rejectattr on the API's own flags, not on the tag: releases/latest
    # excluded drafts and prereleases for free, the list endpoint does not, and
    # a prerelease can carry a version-shaped tag.
    - name: Select the newest release whose tag is a version
      ansible.builtin.set_fact:
        __otel_collector_candidate_versions: >-
          {{ __otel_collector_releases
          | rejectattr('draft') | rejectattr('prerelease')
          | map(attribute='tag_name')
          | select('match', __otel_collector_version_tag_regex)
          | map('regex_replace', __otel_collector_version_tag_regex, '\1')
          | list }}
      run_once: true

    - name: Fail when no release tag is a version
      ansible.builtin.fail:
        msg: >-
          No release at {{ otel_collector_latest_url }} has a tag matching
          {{ __otel_collector_version_tag_regex }}. Tags seen:
          {{ __otel_collector_releases | map(attribute='tag_name') | list }}.
          Set otel_collector_version to a concrete version instead of 'latest'.
      when: __otel_collector_candidate_versions | length == 0
      run_once: true

    - name: Latest available OpenTelemetry Collector version
      ansible.builtin.set_fact:
        otel_collector_version: "{{ __otel_collector_candidate_versions | first }}"

- name: Discover installed version
  block:
    - name: Get installed version
      register: otel_collector_version_check
      changed_when: false
      failed_when: false
      check_mode: false  # Always run, this does not change anything on the system
      ansible.builtin.command: '{{ otel_collector_installation_dir }}/{{ otel_collector_executable }} -v'

    - name: Set installed version variable
      ansible.builtin.set_fact:
        otel_collector_installed_version: "{{ otel_collector_version_check.stdout_lines[0] | default('otelcorecol version 0.0.0') | ansible.builtin.regex_search('\\d+\\.\\d+\\.\\d+') }}"

- name: Create otel group
  ansible.builtin.group:
    name: "{{ otel_collector_service_group }}"
    system: true
  become: true

- name: Create otel user
  ansible.builtin.user:
    name: "{{ otel_collector_service_user }}"
    group: "{{ otel_collector_service_group }}"
    system: true
    create_home: false  # Appropriate for a system user, usually doesn't need a home directory
  become: true

- name: Determine the architecture for OpenTelemetry Collector binary
  ansible.builtin.set_fact:
    otel_collector_arch: "{{ arch_mapping[ansible_facts['architecture']] | default('amd64') }}"
  vars:
    arch_mapping:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
      i386: i386
      ppc64le: ppc64le

- name: Download OpenTelemetry Collector binary
  ansible.builtin.get_url:
    url: "{{ otel_collector_binary_url }}"
    dest: "/tmp/otelcol-{{ otel_collector_type }}-{{ otel_collector_version }}.tar.gz"
    mode: '0755'
  become: true
  when: otel_collector_installed_version is version(otel_collector_version, '!=')

- name: Remove existing OpenTelemetry Collector installation directory
  ansible.builtin.file:
    path: "{{ otel_collector_installation_dir }}"
    state: absent
  become: true
  when: otel_collector_installed_version is version(otel_collector_version, '!=')

- name: Create OpenTelemetry Collector installation directory
  ansible.builtin.file:
    path: "{{ otel_collector_installation_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ otel_collector_service_user }}"
    group: "{{ otel_collector_service_group }}"
  become: true

- name: Extract OpenTelemetry Collector binary
  ansible.builtin.unarchive:
    src: "/tmp/otelcol-{{ otel_collector_type }}-{{ otel_collector_version }}.tar.gz"
    dest: "{{ otel_collector_installation_dir }}"
    remote_src: yes
    owner: "{{ otel_collector_service_user }}"
    group: "{{ otel_collector_service_group }}"
  become: true
  register: extract_result
  when: not ansible_check_mode and otel_collector_installed_version is version(otel_collector_version, '!=')
