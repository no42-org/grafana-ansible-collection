---
namespace: grafana
name: grafana
version: 6.1.0
readme: README.md
authors:
  - Grafana Labs <grafana.com>
  - Ishan Jain <ishan.jain@grafana.com>
  - Gerard van Engelen <g.vanengelen@codepeople.nl>
description: Ansible collection to manage Grafana resources
license:
  - GPL-3.0-or-later
tags: [grafana, observability, monitoring]
dependencies:
  community.general: '>=8.2.0'
  community.grafana: '>=1.5.4'
  ansible.posix: '>=1.5.4'
repository: https://github.com/grafana/grafana-ansible-collection
issues: https://github.com/grafana/grafana-ansible-collection/issues
documentation: https://docs.ansible.com/ansible/latest/collections/grafana/grafana/index.html
build_ignore:
  - node_modules/*
  - pyproject.toml
  - uv.lock
  - .venv/*
# Fork test infrastructure. Consumers get collection content; the harness that
# tests it is this repository's business, like tools/.
  - tests/roles
  # Manifests addressed to this repository rather than to a consumer.
  #
  # Excluded rather than deleted or edited: both are inherited and stay
  # byte-identical to upstream this way, so an upstream merge is unaffected.
  # requirements.yml also has to keep working -- ansible-lint provisions its
  # dependency collections from it, so deleting it would break a lint gate to
  # fix a packaging problem.
  #
  # test-requirements.txt lists Molecule's dependencies for scenarios this fork
  # never invokes. requirements.yml duplicates galaxy.yml's own `dependencies`
  # as unconstrained git URLs, so a consumer following it would install three
  # collections from main instead of the constrained versions that
  # ansible-galaxy resolves from MANIFEST.json.
  - roles/grafana/test-requirements.txt
  - requirements.yml
